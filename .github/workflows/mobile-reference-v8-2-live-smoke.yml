name: Mobile Reference V8.2 Live Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/run-mobile-reference-v8-2-live-smoke.mjs"
      - ".github/workflows/mobile-reference-v8-2-live-smoke.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify V8.2 on both production domains
        run: node scripts/run-mobile-reference-v8-2-live-smoke.mjs
