name: Mobile Evaluation Drill-down V7.6

on:
  pull_request:
    paths:
      - 'preview/mobile-evaluation-drilldown-v7-6.js'
      - 'preview/runtime-single-owner-v8.js'
      - 'preview/server-evaluation-runtime-v4.js'
      - 'scripts/validate-mobile-evaluation-drilldown-v7-6.mjs'
      - '.github/workflows/mobile-evaluation-drilldown-v7-6.yml'
  push:
    branches: [main]
    paths:
      - 'preview/mobile-evaluation-drilldown-v7-6.js'
      - 'preview/runtime-single-owner-v8.js'
      - 'preview/server-evaluation-runtime-v4.js'
      - 'scripts/validate-mobile-evaluation-drilldown-v7-6.mjs'
      - '.github/workflows/mobile-evaluation-drilldown-v7-6.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate mobile evaluation drill-down V7.6
        run: node scripts/validate-mobile-evaluation-drilldown-v7-6.mjs
      - name: Build and dry-run validation
        run: npm run build
