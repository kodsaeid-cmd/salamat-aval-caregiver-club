name: Support Production Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/support-production-proof.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: salamat-support-production-proof
  cancel-in-progress: false

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  DEPLOY_ISSUE: "90"
  DEPLOYED_CODE_COMMIT: 77e351c4c6cfc024f23fff40e4cb1e1bae84370a
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site
  WORKERS_DOMAIN: https://salamat-aval-caregiver-club.kod-saeid.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify support conversation and notification indexes in D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --json \
            --command="SELECT name FROM sqlite_master WHERE type='index' AND name IN ('idx_support_threads_category_queue','idx_support_messages_thread_sender','idx_support_notifications_thread') ORDER BY name;" \
            > /tmp/support-indexes.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload=JSON.parse(fs.readFileSync('/tmp/support-indexes.json','utf8'));
          const found=new Set();
          const visit=value=>{
            if(Array.isArray(value)){for(const item of value)visit(item);return;}
            if(!value||typeof value!=='object')return;
            if(typeof value.name==='string')found.add(value.name);
            for(const child of Object.values(value))visit(child);
          };
          visit(payload);
          for(const name of ['idx_support_threads_category_queue','idx_support_messages_thread_sender','idx_support_notifications_thread']){
            if(!found.has(name))throw new Error(`Missing production support index: ${name}`);
          }
          console.log('Canonical support conversation and notification indexes are live in D1.');
          NODE

      - name: Verify live support runtime, route owner, notifications and legacy removal
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const targets=[process.env.WORKERS_DOMAIN,process.env.CUSTOM_DOMAIN];
          const expectedHeaders={
            'x-salamat-caregiver-platform':'2.4.0',
            'x-salamat-admin-router':'5.0.0',
            'x-salamat-router-priority':'head-first',
            'x-salamat-access-control':'2.0.0',
            'x-salamat-support-runtime':'3.0.0',
            'x-salamat-support-route-owner':'3.0.0',
            'x-salamat-support-unity':'3.0.0',
            'x-salamat-notifications-runtime':'2.0.0',
          };
          const assets=[
            ['staff-support-route-owner-v3.js','3.0.0',"const VERSION='3.0.0'"],
            ['staff-support-direct-runtime-v3.js','3.0.0',"const VERSION='3.0.0'"],
            ['server-notifications-runtime-v2.js','2.0.0',"const VERSION='2.0.0'"],
            ['caregiver-support-notification-bridge-v1.js','1.0.0',"const VERSION='1.0.0'"],
            ['staff-financial-credits-runtime-v2.js','3.1.0',"const HUB_VERSION='3.0.0'"],
          ];
          const legacyPatterns=[
            /staff-support-runtime-v1\.js(?:\?|["'])/,
            /staff-support-direct-runtime-v2\.js(?:\?|["'])/,
            /server-notifications-runtime\.js(?:\?|["'])/,
          ];
          for(const base of targets){
            const deadline=Date.now()+120000;
            let proof=null,last='no response';
            while(Date.now()<deadline){
              try{
                const htmlResponse=await fetch(`${base}/?support-proof=${Date.now()}`,{cache:'no-store',headers:{'cache-control':'no-cache'}});
                const html=await htmlResponse.text();
                const headersOk=htmlResponse.ok&&Object.entries(expectedHeaders).every(([name,value])=>htmlResponse.headers.get(name)===value);
                const assetsResult=await Promise.all(assets.map(async([file,version,marker])=>{
                  const response=await fetch(`${base}/${file}?v=${version}&support-proof=${Date.now()}`,{cache:'no-store',headers:{'cache-control':'no-cache'}});
                  const text=await response.text();
                  return {file,status:response.status,markerOk:text.includes(marker),javascript:/javascript|text\/plain/.test(response.headers.get('content-type')||'')&&!/<html/i.test(text.slice(0,200))};
                }));
                const assetsOk=assetsResult.every(item=>item.status===200&&item.markerOk&&item.javascript);
                const supportOrder=html.indexOf('staff-support-route-owner-v3.js?v=3.0.0')>=0&&html.indexOf('staff-support-direct-runtime-v3.js?v=3.0.0')>html.indexOf('staff-support-route-owner-v3.js?v=3.0.0');
                const notificationsPresent=html.includes('server-notifications-runtime-v2.js?v=2.0.0')&&html.includes('caregiver-support-notification-bridge-v1.js?v=1.0.0');
                const legacyAbsent=legacyPatterns.every(pattern=>!pattern.test(html));
                if(headersOk&&assetsOk&&supportOrder&&notificationsPresent&&legacyAbsent){proof={base,headersOk,assetsResult,supportOrder,notificationsPresent,legacyAbsent};break;}
                last=JSON.stringify({headersOk,assetsOk,assetsResult,supportOrder,notificationsPresent,legacyAbsent});
              }catch(error){last=String(error);}
              await new Promise(resolve=>setTimeout(resolve,4000));
            }
            if(!proof)throw new Error(`Support production proof failed for ${base}: ${last}`);
            console.log(JSON.stringify(proof));
          }
          NODE

      - name: Report successful support production proof
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/support-proof-success.md <<EOF
          ### Production Deploy تأیید شد — پشتیبانی یکپارچه و اعلان پیام

          - کد عملیاتی: \`${DEPLOYED_CODE_COMMIT}\`
          - Workflow اثبات زنده: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Migration و سه Index گفت‌وگو/اعلان پشتیبانی در D1 Production تأیید شدند.
          - هر دو دامنه نسخه‌های \`Support Runtime 3.0.0\`، \`Support Route Owner 3.0.0\` و \`Notifications 2.0.0\` را برگرداندند.
          - Runtime پشتیبانی پرونده، پشتیبانی فوری و امنیتی، وویس و اعلان بالای صفحه روی هر دو دامنه با Status 200 تأیید شد.
          - Runtimeهای قدیمی پشتیبانی و اعلان در HTML زنده وجود نداشتند.
          - خطای اجرای قبلی صرفاً Marker اشتباه تست اعتبارات مالی بود؛ خود انتشار Worker، Static Assets و Migration پیش از آن موفق انجام شده بود.
          EOF
          gh issue comment "$DEPLOY_ISSUE" --body-file /tmp/support-proof-success.md

      - name: Report failed support production proof
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/support-proof-failure.md <<EOF
          ### اثبات Production ناموفق — پشتیبانی یکپارچه و اعلان پیام

          - کد عملیاتی: \`${DEPLOYED_CODE_COMMIT}\`
          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          یکی از Indexهای D1، Headerها، Runtimeهای پشتیبانی/اعلان یا حذف بیلدهای قدیمی روی هر دو دامنه تأیید نشد.
          EOF
          gh issue comment "$DEPLOY_ISSUE" --body-file /tmp/support-proof-failure.md
