name: Diagnose Production Contract History Filters V11

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DB_NAME: salamat-aval-caregiver-club
      WRANGLER_CONFIG: wrangler.backend.jsonc
      CUSTOM_DOMAIN: https://salamatavalcaregivers.site
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Authenticated production API verification
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$password"
          mkdir -p .contract-v11-diag
          node scripts/prepare-release-smoke-fixtures.mjs .contract-v11-diag "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$password"
          cleanup(){ npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --file=.contract-v11-diag/cleanup.sql >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --file=.contract-v11-diag/fixtures.sql >/dev/null
          node - "$CUSTOM_DOMAIN" .contract-v11-diag/meta.json "$password" <<'NODE'
          import fs from 'node:fs';
          const [base,metaPath,password]=process.argv.slice(2);
          const meta=JSON.parse(fs.readFileSync(metaPath,'utf8'));
          const identifier=meta.users.root.username;
          const login=await fetch(`${base}/api/auth/login`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identifier,password})});
          const loginBody=await login.json().catch(()=>({}));
          if(!login.ok)throw new Error(`login ${login.status} ${JSON.stringify(loginBody)}`);
          const cookie=(login.headers.get('set-cookie')||'').split(';')[0];
          if(!cookie)throw new Error('missing session cookie');
          const get=async path=>{
            const response=await fetch(`${base}${path}`,{headers:{cookie,accept:'application/json','cache-control':'no-cache'}});
            const body=await response.json().catch(()=>({}));
            return{status:response.status,body,source:response.headers.get('x-salamat-contract-list-source')};
          };
          const contracts=await get('/api/staff/contracts-v2?sort=end_asc&pageSize=100');
          if(contracts.status!==200)throw new Error(`contracts ${contracts.status}`);
          if(contracts.source!=='multi-period-v3-jalali')throw new Error(`unexpected contract source ${contracts.source}`);
          const contractRows=contracts.body?.data?.contracts||[];
          if(!contractRows.length)throw new Error('production contract list is empty');

          const jalali=await get('/api/staff/contracts-v2?startFrom=%DB%B1%DB%B4%DB%B0%DB%B0%2F%DB%B0%DB%B1%2F%DB%B0%DB%B1&startTo=%DB%B1%DB%B4%DB%B1%DB%B0%2F%DB%B1%DB%B2%2F%DB%B2%DB%B9&sort=start_asc&pageSize=100');
          if(jalali.status!==200)throw new Error(`jalali contracts ${jalali.status} ${JSON.stringify(jalali.body)}`);
          if(jalali.source!=='multi-period-v3-jalali')throw new Error('jalali request did not use V3 source');

          const newest=await get('/api/staff/job-ads?sort=newest');
          const oldest=await get('/api/staff/job-ads?sort=oldest');
          const pointsDesc=await get('/api/staff/job-ads?sort=points_desc');
          const pointsAsc=await get('/api/staff/job-ads?sort=points_asc');
          for(const [name,result] of Object.entries({newest,oldest,pointsDesc,pointsAsc}))if(result.status!==200)throw new Error(`${name} ${result.status}`);
          const rows=x=>x.body?.data?.ads||[];
          const parseTime=value=>{
            const raw=String(value??'').trim();
            if(!raw)return Number.NaN;
            let parsed=Date.parse(raw);
            if(Number.isFinite(parsed))return parsed;
            parsed=Date.parse(raw.replace(' ','T')+(raw.includes('T')||/[zZ]|[+-]\d\d:?\d\d$/.test(raw)?'':'Z'));
            return parsed;
          };
          const dates=x=>rows(x).map(r=>parseTime(r.createdAt));
          const nums=x=>rows(x).map(r=>Number(r.contractPoints||0));
          const monotonic=(xs,dir)=>xs.every((v,i)=>Number.isFinite(v)&&(i===0||(dir==='asc'?xs[i-1]<=v:xs[i-1]>=v)));
          console.log(JSON.stringify({newestDates:rows(newest).map(r=>({id:r.id,createdAt:r.createdAt})),oldestDates:rows(oldest).map(r=>({id:r.id,createdAt:r.createdAt})),pointsDesc:nums(pointsDesc),pointsAsc:nums(pointsAsc)},null,2));
          if(!monotonic(dates(newest),'desc'))throw new Error('newest sorting is not descending/parseable');
          if(!monotonic(dates(oldest),'asc'))throw new Error('oldest sorting is not ascending/parseable');
          if(!monotonic(nums(pointsDesc),'desc'))throw new Error('points_desc sorting is not descending');
          if(!monotonic(nums(pointsAsc),'asc'))throw new Error('points_asc sorting is not ascending');
          const first=rows(newest)[0];
          if(first){
            for(const [key,value] of [['contractType',first.contractType],['shiftType',first.shiftType],['consultantId',first.salesConsultantUserId]]){
              if(!value)continue;
              const filtered=await get(`/api/staff/job-ads?${key}=${encodeURIComponent(value)}&sort=newest`);
              if(filtered.status!==200)throw new Error(`${key} filter ${filtered.status}`);
              const field=key==='consultantId'?'salesConsultantUserId':key;
              if(!rows(filtered).every(r=>String(r[field])===String(value)))throw new Error(`${key} filter returned a mismatched row`);
            }
          }
          const contractAds=rows(newest).filter(r=>r.hasActiveContract&&r.lifecycleStatus==='CONTRACT').length;
          console.log(JSON.stringify({contractStatus:contracts.status,contractRows:contractRows.length,jalaliRows:(jalali.body?.data?.contracts||[]).length,jobAds:rows(newest).length,contractAds,sortsVerified:true,filtersVerified:true,contractSource:contracts.source},null,2));
          NODE

      - name: Canonical versus V3 history counts
        if: always()
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "SELECT (SELECT COUNT(*) FROM caregiver_job_contracts) AS canonical_contracts,(SELECT COUNT(*) FROM contract_cases_v3) AS admin_cases_v3,(SELECT COUNT(*) FROM caregiver_job_contracts jc LEFT JOIN contract_cases_v3 c ON c.job_contract_id=jc.id WHERE c.id IS NULL) AS missing_v3_cases;"

      - name: Reused advertisement has independent periods
        if: always()
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "SELECT jc.id AS job_contract_id,jc.status AS job_contract_status,c.id AS admin_case_v3,c.status AS admin_case_status FROM caregiver_job_contracts jc LEFT JOIN contract_cases_v3 c ON c.job_contract_id=jc.id WHERE jc.ad_id='ad_442222598a134530bca2ec7629ac4826' ORDER BY jc.created_at ASC;"
