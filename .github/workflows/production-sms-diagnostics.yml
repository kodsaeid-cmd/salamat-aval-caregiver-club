name: Production SMS Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**/*sms*"
      - "shared/**/*sms*"
      - "migrations/*sms*"
      - ".github/workflows/production-sms-diagnostics.yml"

permissions:
  contents: read
  issues: write

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site
  DIAGNOSTIC_ISSUE: "90"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Read live automatic SMS readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sms-diagnostics
          deadline=$(( $(date +%s) + 420 ))
          while true; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              -H 'cache-control: no-cache' \
              "${CUSTOM_DOMAIN}/api/system/sms-readiness?diagnostic=${GITHUB_SHA}&t=$(date +%s)" \
              > sms-diagnostics/readiness.json || true
            if node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          let payload={};try{payload=JSON.parse(fs.readFileSync('sms-diagnostics/readiness.json','utf8'))}catch{}
          const data=payload?.data||{};
          const required=['providerReachable','creditCheckOk','creditAvailable','serviceLineAvailable','genericBulkFallbackReady'];
          if(data.version!=='1.0.0'||required.some(key=>!(key in data)))process.exit(1);
          console.log('AUTOMATIC_SMS_READINESS',JSON.stringify(data));
          NODE
            then break; fi
            if (( $(date +%s) >= deadline )); then
              echo '::error::Latest automatic SMS readiness contract did not become live within 7 minutes.'
              cat sms-diagnostics/readiness.json || true
              exit 1
            fi
            sleep 15
          done
          cat sms-diagnostics/readiness.json

      - name: Read aggregate SMS delivery evidence from production D1
        shell: bash
        run: |
          set -euo pipefail
          q1="SELECT message_kind AS messageKind,status,COUNT(*) AS count,MAX(created_at) AS latestAt FROM sms_delivery_log GROUP BY message_kind,status ORDER BY message_kind,status;"
          q2="SELECT status,COUNT(*) AS count,MAX(updated_at) AS latestAt FROM caregiver_activation_sms_events GROUP BY status ORDER BY status;"
          q3="SELECT status,COUNT(*) AS count,MAX(updated_at) AS latestAt FROM caregiver_job_bank_sms_events GROUP BY status ORDER BY status;"
          q4="SELECT status,COUNT(*) AS count,MAX(updated_at) AS latestAt FROM caregiver_job_status_sms_events GROUP BY status ORDER BY status;"
          q5="SELECT status,COUNT(*) AS count,MAX(processed_at) AS latestAt FROM caregiver_change_dispatches GROUP BY status ORDER BY status;"
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q1" --json | tee sms-diagnostics/delivery-log.json
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q2" --json | tee sms-diagnostics/activation-events.json
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q3" --json | tee sms-diagnostics/job-bank-events.json
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q4" --json | tee sms-diagnostics/job-status-events.json
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q5" --json | tee sms-diagnostics/caregiver-change-dispatches.json

          q6="SELECT message_kind AS messageKind,error_code AS errorCode,COUNT(*) AS count,MAX(created_at) AS latestAt FROM sms_delivery_log WHERE status='FAILED' AND error_code IS NOT NULL GROUP BY message_kind,error_code ORDER BY count DESC;"
          q7="SELECT last_error AS errorCode,COUNT(*) AS count,MAX(updated_at) AS latestAt FROM caregiver_activation_sms_events WHERE status='FAILED' AND last_error IS NOT NULL GROUP BY last_error ORDER BY count DESC;"
          q8="SELECT last_error AS errorCode,COUNT(*) AS count,MAX(updated_at) AS latestAt FROM caregiver_job_bank_sms_events WHERE status='FAILED' AND last_error IS NOT NULL GROUP BY last_error ORDER BY count DESC;"
          q9="SELECT last_error AS errorCode,COUNT(*) AS count,MAX(updated_at) AS latestAt FROM caregiver_job_status_sms_events WHERE status='FAILED' AND last_error IS NOT NULL GROUP BY last_error ORDER BY count DESC;"
          q10="SELECT error_code AS errorCode,COUNT(*) AS count,MAX(processed_at) AS latestAt FROM caregiver_change_dispatches WHERE status='FAILED' AND error_code IS NOT NULL GROUP BY error_code ORDER BY count DESC;"
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q6" --json > /tmp/delivery-errors.json
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q7" --json > /tmp/activation-errors.json
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q8" --json > /tmp/job-bank-errors.json
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q9" --json > /tmp/job-status-errors.json
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$q10" --json > /tmp/caregiver-change-errors.json

      - name: Build non-PII diagnostics report
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const read=(name)=>JSON.parse(fs.readFileSync(`sms-diagnostics/${name}.json`,'utf8'));
          const readTmp=(name)=>JSON.parse(fs.readFileSync(`/tmp/${name}.json`,'utf8'));
          const rows=(payload)=>{
            const out=[];const walk=(value)=>{if(Array.isArray(value)){for(const item of value)walk(item);return}if(!value||typeof value!=='object')return;if(Array.isArray(value.results))out.push(...value.results);for(const child of Object.values(value))if(child!==value.results)walk(child)};walk(payload);return out;
          };
          const scrub=(value)=>String(value??'')
            .replace(/09\d{9}/g,'09*********')
            .replace(/\b98\d{10}\b/g,'98**********')
            .replace(/\b\d{8,}\b/g,'[number]')
            .replace(/(x-api-key|api[_ -]?key|token)\s*[:=]?\s*[^\s,;]+/gi,'$1:[redacted]')
            .slice(0,220);
          const safe=(value)=>typeof value==='string'?scrub(value):Array.isArray(value)?value.map(safe):value&&typeof value==='object'?Object.fromEntries(Object.entries(value).map(([k,v])=>[k,safe(v)])):value;
          const readiness=read('readiness').data||{};
          const sections=[
            ['Delivery log',rows(read('delivery-log'))],
            ['Activation outbox',rows(read('activation-events'))],
            ['Job-bank reminder outbox',rows(read('job-bank-events'))],
            ['Job-status outbox',rows(read('job-status-events'))],
            ['Generic caregiver-change dispatcher',rows(read('caregiver-change-dispatches'))],
          ];
          const errorSections=[
            ['Delivery failure causes',rows(readTmp('delivery-errors'))],
            ['Activation failure causes',rows(readTmp('activation-errors'))],
            ['Job-bank failure causes',rows(readTmp('job-bank-errors'))],
            ['Job-status failure causes',rows(readTmp('job-status-errors'))],
            ['Caregiver-change dispatcher failure causes',rows(readTmp('caregiver-change-errors'))],
          ];
          const safeErrors=Object.fromEntries(errorSections.map(([title,data])=>[title,safe(data)]));
          fs.writeFileSync('sms-diagnostics/error-summary.json',JSON.stringify(safeErrors,null,2));
          const lines=['### Production SMS Diagnostics','',`- Commit: \`${process.env.GITHUB_SHA}\``,`- Workflow Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,'',`Readiness: \`${JSON.stringify(readiness)}\``,''];
          for(const [title,data] of sections)lines.push(`**${title}:** \`${JSON.stringify(data)}\``,'');
          for(const [title,data] of errorSections)lines.push(`**${title}:** \`${JSON.stringify(safe(data))}\``,'');
          lines.push('این گزارش فقط وضعیت‌ها، تعدادها، زمان آخرین رکورد و علت خطای پاک‌سازی‌شده را نشان می‌دهد و هیچ شماره موبایل، API key یا Template ID را منتشر نمی‌کند.');
          fs.writeFileSync('sms-diagnostics/report.md',lines.join('\n'));
          console.log(lines.join('\n'));
          NODE

      - name: Upload SMS diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: production-sms-diagnostics-${{ github.run_id }}
          path: sms-diagnostics
          retention-days: 30
          if-no-files-found: error

      - name: Report SMS diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$DIAGNOSTIC_ISSUE" --body-file sms-diagnostics/report.md
