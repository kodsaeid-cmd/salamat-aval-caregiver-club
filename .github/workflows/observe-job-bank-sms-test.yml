name: Observe Job Bank SMS Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/observe-job-bank-sms-test.yml'

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read test workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/job-bank-sms-test-v1.yml/runs?per_page=5" \
            | jq '{runs:[.workflow_runs[]|{id,status,conclusion,head_sha,created_at,updated_at,run_number}]}' \
            > ops/job-bank-sms-test-runs.json
          cat ops/job-bank-sms-test-runs.json
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/job-bank-sms-test-runs.json
          git commit -m "ops: record job bank SMS test run status" || exit 0
          git push
