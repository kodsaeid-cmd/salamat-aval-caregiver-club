name: Apply Evaluation V16 Imports

on:
  push:
    branches:
      - feat/evaluation-list-sort-filters-v16
    paths:
      - ".github/workflows/apply-evaluation-v16-imports.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evaluation-list-sort-filters-v16
          fetch-depth: 0
      - name: Wire desktop and mobile evaluation v4
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('desktop-react/app.tsx')
          text=app.read_text()
          old='import {EvaluationsPage} from "./evaluations-v3";'
          new='import {EvaluationsPage} from "./evaluations-v4";'
          if old not in text: raise SystemExit('desktop evaluations v3 import not found')
          app.write_text(text.replace(old,new,1))

          router=Path('mobile-react/admin-router-v2.tsx')
          text=router.read_text()
          old='import {AdminEvaluationsMobileV3} from "./admin-evaluations-v3";'
          new='import {AdminEvaluationsMobileV4} from "./admin-evaluations-v4";'
          if old not in text: raise SystemExit('mobile evaluations v3 import not found')
          text=text.replace(old,new,1)
          old='<AdminEvaluationsMobileV3 user={user} onExit={()=>go("/mobile/admin/")}/>'
          new='<AdminEvaluationsMobileV4 user={user} onExit={()=>go("/mobile/admin/")}/>'
          if old not in text: raise SystemExit('mobile evaluations v3 route render not found')
          router.write_text(text.replace(old,new,1))
          PY
          rm .github/workflows/apply-evaluation-v16-imports.yml
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-react/app.tsx mobile-react/admin-router-v2.tsx .github/workflows/apply-evaluation-v16-imports.yml
          git commit -m "feat: wire evaluation sort filters on desktop and mobile"
          git push origin HEAD:feat/evaluation-list-sort-filters-v16
