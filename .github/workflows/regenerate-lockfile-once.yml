name: Regenerate npm lockfile once

on:
  push:
    branches:
      - fix/cloudflare-invalid-lockfile
    paths:
      - .github/workflows/regenerate-lockfile-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/regenerate-lockfile-once.yml
      - package-lock.json

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-invalid-lockfile
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Generate complete npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packageCount = Object.keys(lock.packages || {}).length;
          if (packageCount < 50) {
            throw new Error(`Generated lockfile is unexpectedly incomplete: ${packageCount} package entries`);
          }
          console.log(`Validated complete lockfile with ${packageCount} package entries.`);
          NODE

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: regenerate complete npm lockfile"
          git push origin HEAD:fix/cloudflare-invalid-lockfile
