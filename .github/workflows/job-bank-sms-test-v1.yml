name: Controlled Job Bank SMS Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-bank-sms-test-v1.yml'
      - 'scripts/job-bank-sms-test-patch-v1.py'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: salamat-aval-caregiver-club
  WORKER_URL: https://salamat-aval-caregiver-club.kod-saeid.workers.dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Inspect production SMS bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          settings="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")"
          template="$(printf '%s' "$settings" | jq -r '.result.bindings[] | select(.name=="SMSIR_JOB_BANK_TEMPLATE_ID") | .text // empty' | head -n1)"
          parameter="$(printf '%s' "$settings" | jq -r '.result.bindings[] | select(.name=="SMSIR_JOB_BANK_COUNT_PARAMETER") | .text // empty' | head -n1)"
          api_key_type="$(printf '%s' "$settings" | jq -r '.result.bindings[] | select(.name=="SMSIR_API_KEY") | .type // empty' | head -n1)"
          printf 'template_id=%s\nparameter=%s\napi_key_binding_type=%s\n' "$template" "$parameter" "$api_key_type" > ops/job-bank-sms-test-result.txt
          cat ops/job-bank-sms-test-result.txt
          test -n "$template"
          test -n "$parameter"
          test -n "$api_key_type"

      - name: Patch and typecheck test route
        shell: bash
        run: |
          set -euo pipefail
          python scripts/job-bank-sms-test-patch-v1.py
          npx tsc --noEmit

      - name: Deploy temporary route, send once, restore canonical worker
        shell: bash
        run: |
          set -u
          restore_worker() {
            git checkout -- worker/index-desktop-react-v1.ts
            if npx wrangler deploy --config wrangler.backend.jsonc >/tmp/job-bank-sms-restore.log 2>&1; then
              echo 'restore=success' >> ops/job-bank-sms-test-result.txt
              return 0
            fi
            echo 'restore=failed' >> ops/job-bank-sms-test-result.txt
            cat /tmp/job-bank-sms-restore.log
            return 1
          }
          trap 'restore_worker || true' EXIT

          if ! npx wrangler deploy --config wrangler.backend.jsonc >/tmp/job-bank-sms-test-deploy.log 2>&1; then
            echo 'temporary_deploy=failed' >> ops/job-bank-sms-test-result.txt
            cat /tmp/job-bank-sms-test-deploy.log
            exit 1
          fi
          echo 'temporary_deploy=success' >> ops/job-bank-sms-test-result.txt

          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/job-bank-ready.txt -w '%{http_code}' -H 'x-ops-probe: jb-sms-test-20260818-v1' "$WORKER_URL/__ops/job-bank-sms-test-ready" || true)"
            if [ "$code" = 200 ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo 'probe_ready=false' >> ops/job-bank-sms-test-result.txt
            exit 1
          fi
          echo 'probe_ready=true' >> ops/job-bank-sms-test-result.txt

          # Exactly one POST is made to the sending route. It is never retried.
          http_code="$(curl -sS -o /tmp/job-bank-send.json -w '%{http_code}' -X POST -H 'x-ops-probe: jb-sms-test-20260818-v1' "$WORKER_URL/__ops/job-bank-sms-test-send" || true)"
          echo "send_http_status=$http_code" >> ops/job-bank-sms-test-result.txt
          printf 'send_body=' >> ops/job-bank-sms-test-result.txt
          tr -d '\n' </tmp/job-bank-send.json >> ops/job-bank-sms-test-result.txt || true
          printf '\n' >> ops/job-bank-sms-test-result.txt

          if ! restore_worker; then
            trap - EXIT
            exit 1
          fi
          trap - EXIT
          cat ops/job-bank-sms-test-result.txt

      - name: Publish test result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/job-bank-sms-test-result.txt || true
          git commit -m "ops: record controlled job bank SMS test" || exit 0
          git push
