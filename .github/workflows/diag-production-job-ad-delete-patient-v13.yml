name: Diagnose Production Job Ad Delete Patient V13

on:
  pull_request:
    paths:
      - '.github/workflows/diag-production-job-ad-delete-patient-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Authenticated isolated production verification
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$password"
          mkdir -p .job-ad-v13-diag
          node scripts/prepare-release-smoke-fixtures.mjs .job-ad-v13-diag "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$password"

          run_id="$(jq -r '.runId' .job-ad-v13-diag/meta.json)"
          root_id="$(jq -r '.users.root.id' .job-ad-v13-diag/meta.json)"
          caregiver_id="$(jq -r '.caregiverProfile.id' .job-ad-v13-diag/meta.json)"
          consultant_id="RC-${run_id}-SALES"
          app_id="RC-${run_id}-APP"
          contract_id="RC-${run_id}-CONTRACT"

          cleanup(){
            set +e
            if [[ -f .job-ad-v13-diag/ids.json ]]; then
              delete_id="$(jq -r '.delete90 // empty' .job-ad-v13-diag/ids.json)"
              guard_id="$(jq -r '.guard180 // empty' .job-ad-v13-diag/ids.json)"
              long_id="$(jq -r '.long360 // empty' .job-ad-v13-diag/ids.json)"
              temp_id="$(jq -r '.temporary180 // empty' .job-ad-v13-diag/ids.json)"
              cat > .job-ad-v13-diag/cleanup-targets.sql <<SQL
          PRAGMA foreign_keys=ON;
          DELETE FROM contract_service_providers_v3 WHERE contract_case_id IN (SELECT id FROM contract_cases_v3 WHERE job_contract_id='${contract_id}');
          DELETE FROM contract_cases_v3 WHERE job_contract_id='${contract_id}';
          DELETE FROM contract_service_providers_v2 WHERE contract_case_id IN (SELECT id FROM contract_cases_v2 WHERE job_contract_id='${contract_id}');
          DELETE FROM contract_cases_v2 WHERE job_contract_id='${contract_id}';
          DELETE FROM caregiver_job_contracts WHERE id='${contract_id}';
          DELETE FROM care_job_applications WHERE id='${app_id}';
          DELETE FROM care_job_ads WHERE id IN ('${delete_id}','${guard_id}','${long_id}','${temp_id}');
          DELETE FROM users WHERE id='${consultant_id}';
          SQL
              npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --file=.job-ad-v13-diag/cleanup-targets.sql >/dev/null 2>&1 || true
            else
              npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "DELETE FROM users WHERE id='${consultant_id}';" >/dev/null 2>&1 || true
            fi
            npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --file=.job-ad-v13-diag/cleanup.sql >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --file=.job-ad-v13-diag/fixtures.sql >/dev/null
          cat > .job-ad-v13-diag/consultant.sql <<SQL
          INSERT INTO users(id,caregiver_id,full_name,mobile,username,password_hash,role,status,permissions_json,created_at,updated_at)
          SELECT '${consultant_id}',NULL,'آزمون مشاور بانک آگهی','internal-${consultant_id}','sales-${run_id}@invalid.local',password_hash,'SALES_CONSULTANT','ACTIVE','[]',datetime('now'),datetime('now')
          FROM users WHERE id='${root_id}';
          SQL
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --file=.job-ad-v13-diag/consultant.sql >/dev/null

          node - "$CUSTOM_DOMAIN" .job-ad-v13-diag/meta.json "$password" "$consultant_id" .job-ad-v13-diag/ids.json .job-ad-v13-diag/cookie <<'NODE'
          import fs from 'node:fs';
          const [base,metaPath,password,consultantId,idsPath,cookiePath]=process.argv.slice(2);
          const meta=JSON.parse(fs.readFileSync(metaPath,'utf8'));
          const login=await fetch(`${base}/api/auth/login`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identifier:meta.users.root.username,password})});
          if(!login.ok)throw new Error(`login ${login.status}`);
          const cookie=(login.headers.get('set-cookie')||'').split(';')[0];
          if(!cookie)throw new Error('missing session cookie');
          fs.writeFileSync(cookiePath,cookie,{mode:0o600});
          const ids={};
          const create=async(key,days,shiftType='DAY')=>{
            const response=await fetch(`${base}/api/staff/job-ads`,{method:'POST',headers:{cookie,'content-type':'application/json',accept:'application/json'},body:JSON.stringify({customerFullName:`Smoke Patient ${days}`,city:'تهران',region:'آزمون',salesConsultantUserId:consultantId,contractType:'PATIENT',shiftType,caregiverSalaryRial:100000000,durationDays:days,description:'isolated production diagnostic'})});
            const body=await response.json().catch(()=>({}));
            if(response.status!==201)throw new Error(`create ${key} ${response.status} ${JSON.stringify(body)}`);
            ids[key]=body?.data?.id;
            fs.writeFileSync(idsPath,JSON.stringify(ids),{mode:0o600});
            const expected=Math.max(1,Math.round(130*days/180));
            if(body?.data?.recipientCondition!=='PATIENT')throw new Error(`${key} patient condition was not forced`);
            if(Number(body?.data?.contractPoints)!==expected||Number(body?.data?.autoContractPoints)!==expected)throw new Error(`${key} points mismatch`);
            if(Number(body?.data?.pointsBasisDays)!==180||Number(body?.data?.pointsBaseValue)!==130)throw new Error(`${key} basis mismatch`);
            if(response.headers.get('x-salamat-job-ad-mutation')!=='13.0.0')throw new Error(`${key} mutation owner mismatch`);
            return {days,shiftType,points:expected,id:ids[key]};
          };
          const results=[];
          try{
            results.push(await create('delete90',90));
            results.push(await create('guard180',180));
            results.push(await create('long360',360));
            results.push(await create('temporary180',180,'TEMPORARY'));
          }finally{fs.writeFileSync(idsPath,JSON.stringify(ids),{mode:0o600})}
          console.log(JSON.stringify({created:results.map(x=>({days:x.days,shiftType:x.shiftType,points:x.points})),patientCondition:'PATIENT',basisDays:180,basePoints:130},null,2));
          NODE

          delete_id="$(jq -r '.delete90' .job-ad-v13-diag/ids.json)"
          guard_id="$(jq -r '.guard180' .job-ad-v13-diag/ids.json)"
          long_id="$(jq -r '.long360' .job-ad-v13-diag/ids.json)"
          temp_id="$(jq -r '.temporary180' .job-ad-v13-diag/ids.json)"
          ts="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          cat > .job-ad-v13-diag/state.sql <<SQL
          UPDATE care_job_ads SET status='PUBLISHED',published_at='${ts}',updated_at='${ts}' WHERE id='${delete_id}';
          INSERT INTO care_job_applications(id,ad_id,caregiver_id,status,applied_at,updated_at,lifecycle_status)
          VALUES('${app_id}','${guard_id}','${caregiver_id}','IN_CONTRACT','${ts}','${ts}','IN_CONTRACT');
          INSERT INTO caregiver_job_contracts(id,caregiver_id,ad_id,application_id,started_at,scheduled_end_at,duration_days,total_points_units,earned_points_units,last_reconciled_day,status,points_model,started_by_user_id,welcome_seen_at,created_at,updated_at)
          VALUES('${contract_id}','${caregiver_id}','${guard_id}','${app_id}','${ts}','2099-01-01T00:00:00.000Z',180,13000,0,0,'ACTIVE','DAILY_V1','${root_id}',NULL,'${ts}','${ts}');
          SQL
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --file=.job-ad-v13-diag/state.sql >/dev/null

          node - "$CUSTOM_DOMAIN" .job-ad-v13-diag/cookie .job-ad-v13-diag/ids.json <<'NODE'
          import fs from 'node:fs';
          const [base,cookiePath,idsPath]=process.argv.slice(2),cookie=fs.readFileSync(cookiePath,'utf8'),ids=JSON.parse(fs.readFileSync(idsPath,'utf8'));
          const read=async(path,init={})=>{const response=await fetch(`${base}${path}`,{...init,headers:{cookie,accept:'application/json',...(init.headers||{})}});const body=await response.json().catch(()=>({}));return{response,body}};
          const del=await read(`/api/staff/job-ads/${encodeURIComponent(ids.delete90)}`,{method:'DELETE'});
          if(del.response.status!==200||del.body?.data?.deleted!==true)throw new Error(`published delete ${del.response.status} ${JSON.stringify(del.body)}`);
          if(del.response.headers.get('x-salamat-job-ad-mutation')!=='13.0.0')throw new Error('delete mutation owner mismatch');
          const list=await read('/api/staff/job-ads?sort=newest');
          if(list.response.status!==200)throw new Error(`list ${list.response.status}`);
          if((list.body?.data?.ads||[]).some(x=>x.id===ids.delete90))throw new Error('deleted ad remains in bank');
          const detail=await read(`/api/staff/job-ads/${encodeURIComponent(ids.delete90)}`);
          if(detail.response.status!==404)throw new Error(`deleted detail ${detail.response.status}`);
          const guard=await read(`/api/staff/job-ads/${encodeURIComponent(ids.guard180)}`,{method:'DELETE'});
          if(guard.response.status!==409||guard.body?.error!=='active_contract_blocks_delete')throw new Error(`active contract guard ${guard.response.status} ${JSON.stringify(guard.body)}`);
          console.log(JSON.stringify({publishedDeleteStatus:del.response.status,deletedHiddenFromBank:true,deletedDetailStatus:detail.response.status,activeContractDeleteStatus:guard.response.status,activeContractDeleteCode:guard.body?.error,listSource:list.response.headers.get('x-salamat-job-ad-list-source')},null,2));
          NODE

          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "SELECT id,status,CASE WHEN deleted_at IS NULL THEN 0 ELSE 1 END AS tombstoned FROM care_job_ads WHERE id IN ('${delete_id}','${guard_id}') ORDER BY id; SELECT COUNT(*) AS patient_auto_mismatch FROM care_job_ads WHERE contract_type='PATIENT' AND COALESCE(points_mode,'AUTO')<>'SPECIAL' AND (COALESCE(recipient_condition,'')<>'PATIENT' OR COALESCE(points_basis_days,0)<>180 OR COALESCE(points_base_value,0)<>130 OR COALESCE(auto_contract_points,0)<>CAST(MAX(1,ROUND(130.0*duration_days/180.0)) AS INTEGER));"
