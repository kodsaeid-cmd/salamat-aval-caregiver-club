name: Observe Job Request Validation

on:
  push:
    branches:
      - feat/job-request-unread-terminology-v1
    paths:
      - '.github/workflows/observe-job-request-validation-v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/job-request-unread-terminology-v1
      - name: Wait and record validation run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          sleep 25
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/fix-and-validate-job-request-v1.yml/runs?branch=feat%2Fjob-request-unread-terminology-v1&per_page=5" \
            | jq '{runs:[.workflow_runs[]|{id,status,conclusion,head_sha,run_number,created_at,updated_at}]}' > ops/job-request-validation-runs.json
          cat ops/job-request-validation-runs.json
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/job-request-validation-runs.json
          git commit -m 'ops: record job request validation status' || exit 0
          git push origin HEAD:feat/job-request-unread-terminology-v1
