name: Prelaunch Active Self-Registered Audit

on:
  push:
    branches: [audit/prelaunch-approval-diagnostics]
    paths:
      - ".github/workflows/prelaunch-active-selfregistered-audit.yml"

permissions:
  contents: read

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read approval and registration audit history
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT a.entity_id AS caregiverId,c.full_name AS fullName,a.action,a.created_at AS createdAt,a.actor_user_id AS actorUserId FROM audit_logs a JOIN caregivers c ON c.id=a.entity_id WHERE a.entity_type='caregiver' AND a.entity_id IN ('CP-MSIQIQF6RGX','CP-MSECM7J84L3') ORDER BY a.entity_id,a.created_at ASC;"
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$query" --json
