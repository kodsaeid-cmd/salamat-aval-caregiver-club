name: Diagnose Production Contract Bank State V9

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DB_NAME: salamat-aval-caregiver-club
      WRANGLER_CONFIG: wrangler.backend.jsonc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Application lifecycle distribution
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "SELECT status,COALESCE(lifecycle_status,'<NULL>') AS lifecycle_status,COUNT(*) AS n FROM care_job_applications GROUP BY status,COALESCE(lifecycle_status,'<NULL>') ORDER BY n DESC;"
      - name: Contract-relevant applications
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "SELECT ap.id AS application_id,ap.ad_id,ap.status AS physical_status,COALESCE(ap.lifecycle_status,ap.status) AS lifecycle_status,a.status AS ad_status,jc.id AS job_contract_id,jc.status AS job_contract_status,c.id AS contract_case_id,c.status AS contract_case_status FROM care_job_applications ap JOIN care_job_ads a ON a.id=ap.ad_id LEFT JOIN caregiver_job_contracts jc ON jc.application_id=ap.id LEFT JOIN contract_cases_v2 c ON c.job_contract_id=jc.id WHERE COALESCE(ap.lifecycle_status,ap.status) IN ('IN_CONTRACT','WITHDRAWN','COMPLETED') OR jc.id IS NOT NULL ORDER BY ap.updated_at DESC LIMIT 100;"
      - name: Missing canonical and admin rows
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "SELECT SUM(CASE WHEN COALESCE(ap.lifecycle_status,ap.status)='IN_CONTRACT' AND jc.id IS NULL THEN 1 ELSE 0 END) AS in_contract_without_job_contract,SUM(CASE WHEN jc.id IS NOT NULL AND c.id IS NULL THEN 1 ELSE 0 END) AS job_contract_without_admin_case,SUM(CASE WHEN jc.status='ACTIVE' AND a.status<>'CLOSED' THEN 1 ELSE 0 END) AS active_contract_ad_not_closed,SUM(CASE WHEN jc.status='ACTIVE' AND COALESCE(ap.lifecycle_status,ap.status)<>'IN_CONTRACT' THEN 1 ELSE 0 END) AS active_contract_application_not_in_contract FROM care_job_applications ap JOIN care_job_ads a ON a.id=ap.ad_id LEFT JOIN caregiver_job_contracts jc ON jc.application_id=ap.id LEFT JOIN contract_cases_v2 c ON c.job_contract_id=jc.id;"
      - name: Job ad and contract distributions
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "SELECT 'job_ads' AS entity,status,COUNT(*) AS n FROM care_job_ads GROUP BY status UNION ALL SELECT 'job_contracts' AS entity,status,COUNT(*) AS n FROM caregiver_job_contracts GROUP BY status UNION ALL SELECT 'contract_cases' AS entity,status,COUNT(*) AS n FROM contract_cases_v2 GROUP BY status ORDER BY entity,status;"
      - name: Ads that should render as contract
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "SELECT a.id AS ad_id,a.status AS ad_status,MAX(CASE WHEN jc.status='ACTIVE' THEN 1 ELSE 0 END) AS has_active_job_contract,MAX(CASE WHEN COALESCE(ap.lifecycle_status,ap.status)='IN_CONTRACT' THEN 1 ELSE 0 END) AS has_in_contract_application,COUNT(DISTINCT c.id) AS admin_case_count FROM care_job_ads a LEFT JOIN care_job_applications ap ON ap.ad_id=a.id LEFT JOIN caregiver_job_contracts jc ON jc.ad_id=a.id AND jc.status='ACTIVE' LEFT JOIN contract_cases_v2 c ON c.job_ad_id=a.id WHERE jc.id IS NOT NULL OR COALESCE(ap.lifecycle_status,ap.status)='IN_CONTRACT' GROUP BY a.id,a.status ORDER BY a.updated_at DESC LIMIT 100;"
