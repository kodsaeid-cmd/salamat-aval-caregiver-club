name: Mobile React Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salamat-aval-production-deploy
  cancel-in-progress: false

env:
  WRANGLER_CONFIG: wrangler.backend.jsonc
  DATABASE_BACKEND: turso
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Turso-backed application
        run: |
          npm run typecheck
          node scripts/validate-turso-backend-v1.mjs
          npm run deploy:check

      - name: Deploy mobile, desktop and Worker bundle
        run: npm run deploy

      - name: Verify production auth path
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/turso-mobile-deploy-auth.json -w '%{http_code}' \
            -X POST 'https://salamatavalcaregivers.site/api/auth/login' \
            -H 'Content-Type: application/json' \
            --data '{"identifier":"__mobile_deploy_probe__","password":"invalid-probe-password"}')"
          [[ "$status" == "401" ]] || { cat /tmp/turso-mobile-deploy-auth.json; echo "::error::Expected auth probe 401, got $status"; exit 1; }
