name: SMS.ir Line Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smsir-line-diagnostic.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_CONFIG: wrangler.backend.jsonc
  PROBE_URL: https://salamat-aval-caregiver-club.kod-saeid.workers.dev/__ops/smsir-lines-xU4k2G9pQ7nVm3Lz

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Confirm SMS.ir bindings exist
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --config "$WRANGLER_CONFIG")"
          printf '%s' "$secrets_json" | grep -q 'SMSIR_API_KEY'
          settings="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/salamat-aval-caregiver-club/settings")"
          printf '%s' "$settings" | grep -q 'SMSIR_LINE_NUMBER'
          echo 'SMS.ir bindings are present.'
      - name: Patch temporary line diagnostic route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/index-desktop-react-v1.ts')
          s=p.read_text()
          needle='    const url = new URL(request.url);const method = request.method.toUpperCase();'
          probe='''\n    if(url.pathname==="/__ops/smsir-lines-xU4k2G9pQ7nVm3Lz"&&method==="GET"){
      const apiKey=String(env.SMSIR_API_KEY||"").trim();
      const configuredLine=String(env.SMSIR_LINE_NUMBER||"").trim();
      const response=await fetch("https://api.sms.ir/v1/line",{method:"GET",headers:{accept:"application/json","x-api-key":apiKey}});
      const raw=await response.text();
      let body:any=raw;try{body=raw?JSON.parse(raw):null}catch{}
      return new Response(JSON.stringify({httpStatus:response.status,configuredLine,body}),{status:response.ok?200:500,headers:{"content-type":"application/json;charset=UTF-8","cache-control":"no-store"}});
    }'''
          if needle not in s:
              raise SystemExit('diagnostic insertion point not found')
          s=s.replace(needle,needle+probe,1)
          p.write_text(s)
          PY
          npx tsc --noEmit
      - name: Deploy diagnostic, inspect lines, restore canonical worker
        shell: bash
        run: |
          set -u
          restore() {
            git checkout -- worker/index-desktop-react-v1.ts
            npx wrangler deploy --config "$WRANGLER_CONFIG" >/tmp/smsir-lines-restore.log 2>&1 || { cat /tmp/smsir-lines-restore.log; return 1; }
            echo 'Canonical worker restored.'
          }
          trap restore EXIT
          npx wrangler deploy --config "$WRANGLER_CONFIG" >/tmp/smsir-lines-deploy.log 2>&1 || { cat /tmp/smsir-lines-deploy.log; exit 1; }
          http_code='404'
          for attempt in 1 2 3 4 5 6 7 8; do
            sleep 2
            http_code="$(curl -sS -o /tmp/smsir-lines-result.json -w '%{http_code}' "$PROBE_URL")"
            echo "Diagnostic attempt $attempt HTTP status: $http_code"
            if [ "$http_code" != '404' ]; then break; fi
          done
          cat /tmp/smsir-lines-result.json || true
          echo
          test "$http_code" = '200'
