name: D1 Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "35 1 * * *"

permissions:
  contents: read

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PARSPACK_S3_ENDPOINT: ${{ secrets.PARSPACK_S3_ENDPOINT }}
  PARSPACK_S3_BUCKET: ${{ secrets.PARSPACK_S3_BUCKET }}
  PARSPACK_S3_ACCESS_KEY: ${{ secrets.PARSPACK_S3_ACCESS_KEY }}
  PARSPACK_S3_SECRET_KEY: ${{ secrets.PARSPACK_S3_SECRET_KEY }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare backup credentials
        id: guard
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::D1 backup skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured as repository secrets."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci --ignore-scripts

      - name: Export D1 database and protected evaluation tables
        if: steps.guard.outputs.enabled == 'true'
        id: export
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="backups/${stamp}"
          mkdir -p "$backup_dir"

          npx wrangler d1 time-travel info "$DB_NAME" --config "$WRANGLER_CONFIG" > "$backup_dir/time-travel-bookmark.txt"
          npx wrangler d1 export "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --output="$backup_dir/database.sql"

          for table in \
            caregiver_evaluation_periods \
            caregiver_evaluation_scores \
            evaluation_score_revisions \
            evaluation_final_snapshots \
            evaluation_archival_events \
            caregiver_archival_events; do
            npx wrangler d1 export "$DB_NAME" --remote --config "$WRANGLER_CONFIG" \
              --table="$table" --output="$backup_dir/${table}.sql"
          done

          sha256sum "$backup_dir"/*.sql > "$backup_dir/checksums.sha256"
          gzip -9 "$backup_dir"/*.sql

          node --input-type=module <<'NODE' "$backup_dir" "$stamp" "$GITHUB_SHA"
          import fs from 'node:fs';
          import path from 'node:path';
          const [dir, stamp, sha] = process.argv.slice(2);
          const checksums = fs.readFileSync(path.join(dir, 'checksums.sha256'), 'utf8')
            .trim().split('\n').filter(Boolean).map((line) => {
              const [checksum, file] = line.trim().split(/\s+/, 2);
              return { checksum, file: path.basename(file) + '.gz' };
            });
          const manifest = {
            formatVersion: 1,
            database: process.env.DB_NAME,
            createdAt: new Date().toISOString(),
            stamp,
            gitCommit: sha,
            evaluationProtectionSchema: 'EVAL-PROTECT-1.0.0',
            compressed: true,
            checksumAlgorithm: 'SHA-256',
            files: checksums,
          };
          fs.writeFileSync(path.join(dir, 'manifest.json'), JSON.stringify(manifest, null, 2));
          NODE

          echo "backup_dir=$backup_dir" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Upload protected backup artifact
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: salamat-aval-d1-${{ steps.export.outputs.stamp }}
          path: ${{ steps.export.outputs.backup_dir }}
          retention-days: 90
          if-no-files-found: error

      - name: Copy backup to independent ParsPack storage
        if: >-
          steps.guard.outputs.enabled == 'true' &&
          env.PARSPACK_S3_ENDPOINT != '' &&
          env.PARSPACK_S3_BUCKET != '' &&
          env.PARSPACK_S3_ACCESS_KEY != '' &&
          env.PARSPACK_S3_SECRET_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet awscli
          export AWS_ACCESS_KEY_ID="$PARSPACK_S3_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$PARSPACK_S3_SECRET_KEY"
          export AWS_DEFAULT_REGION="us-east-1"
          aws s3 cp "${{ steps.export.outputs.backup_dir }}" \
            "s3://${PARSPACK_S3_BUCKET}/salamat-aval-backups/daily/${{ steps.export.outputs.stamp }}/" \
            --recursive --endpoint-url "$PARSPACK_S3_ENDPOINT" --no-progress

      - name: Backup summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.guard.outputs.enabled }}" == "true" ]]; then
            echo "D1 backup workflow completed for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            echo "The full database and protected evaluation tables were exported with SHA-256 checksums." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "D1 backup was not executed because required Cloudflare repository secrets are missing." >> "$GITHUB_STEP_SUMMARY"
          fi
