name: Mobile Role Icon Shell V7.2

on:
  pull_request:
    paths:
      - 'preview/mobile-caregiver-shell-v5.js'
      - 'preview/mobile-role-icon-shell-v7-1.js'
      - 'preview/mobile-caregiver-profile-icon-polish-v7-2.js'
      - 'worker/index-unified-financial-v4.ts'
      - 'scripts/validate-mobile-caregiver-shell-v5.mjs'
      - 'scripts/validate-mobile-caregiver-polish-v7-2.mjs'
      - '.github/workflows/mobile-caregiver-shell-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate all-role mobile icon shell contract
        run: node scripts/validate-mobile-caregiver-shell-v5.mjs
      - name: Validate caregiver profile and detailed icons
        run: node scripts/validate-mobile-caregiver-polish-v7-2.mjs
      - name: Build and dry-run validation
        run: npm run build
