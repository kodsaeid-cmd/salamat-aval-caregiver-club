name: Diagnose live login video

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production failure and recovery uploader
        shell: bash
        run: |
          set -euxo pipefail
          PROD='https://salamatavalcaregivers.site'
          PREVIEW='https://fix-embed-login-video-asset-salamat-aval-caregiver-club.kod-saeid.workers.dev'
          echo '=== CURRENT PRODUCTION VIDEO ==='
          curl -sS -D /tmp/prod.headers -o /tmp/prod.body --max-time 45 -H 'Range: bytes=0-31' "$PROD/media/caregiver-club-intro.mp4?v=1.0.0"
          cat /tmp/prod.headers
          cat /tmp/prod.body
          echo
          echo '=== RECOVERY UPLOADER ==='
          curl -fsS -D /tmp/upload.headers -o /tmp/upload.html --max-time 45 "$PREVIEW/system/login-intro-video-upload-782bb1"
          cat /tmp/upload.headers
          grep -F 'بارگذاری ویدئوی معرفی باشگاه مراقبین' /tmp/upload.html
          grep -F '938_032' /dev/null || true
          test "$(wc -c < /tmp/upload.html)" -gt 2000
