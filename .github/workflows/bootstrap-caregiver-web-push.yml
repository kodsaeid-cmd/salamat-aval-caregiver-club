name: Bootstrap Caregiver Web Push

on:
  push:
    branches: [main]
    paths:
      - "worker/caregiver-web-push-v2.ts"
      - "mobile-react/caregiver-web-push-runtime-v1.ts"
      - "preview/caregiver-push-sw.js"
      - "scripts/ensure-caregiver-web-push-secrets.mjs"
      - ".github/workflows/bootstrap-caregiver-web-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: salamat-aval-web-push-bootstrap
  cancel-in-progress: false

env:
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair and verify production VAPID secrets
        run: node scripts/ensure-caregiver-web-push-secrets.mjs

      - name: Report Web Push bootstrap evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 90 --repo "$GITHUB_REPOSITORY" --body "### Caregiver Web Push VAPID آماده شد

- Commit: \`$GITHUB_SHA\`
- Workflow Run: $run_url
- کلیدهای \`VAPID_PUBLIC_KEY\`، \`VAPID_PRIVATE_KEY\` و \`VAPID_SUBJECT\` به‌صورت Cloudflare Worker Secret تأیید شدند.
- Repair marker نسخه اول نیز ثبت شد تا در اجراهای بعدی همان جفت کلید پایدار حفظ شود و بی‌جهت Rotate نشود.
- مقدار هیچ Secret در Log یا Repository ثبت نشده است.
- کانال SMS و OTP مستقل است و این Workflow هیچ تنظیم SMS را تغییر نمی‌دهد."
