name: Bootstrap Caregiver Web Push

on:
  push:
    branches: [main]
    paths:
      - "worker/caregiver-web-push-v2.ts"
      - "mobile-react/caregiver-web-push-runtime-v1.ts"
      - "preview/caregiver-push-sw.js"
      - ".github/workflows/bootstrap-caregiver-web-push.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salamat-aval-web-push-bootstrap
  cancel-in-progress: false

env:
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Create VAPID secrets only when absent
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secret_list="$RUNNER_TEMP/worker-secrets.json"
          vapid_file="$RUNNER_TEMP/vapid-secrets.json"
          npx wrangler secret list --format json --config "$WRANGLER_CONFIG" > "$secret_list"
          if node --input-type=module - "$secret_list" <<'NODE'
          import fs from 'node:fs';
          const names=new Set(JSON.parse(fs.readFileSync(process.argv[2],'utf8')).map(item=>item.name));
          const required=['VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','VAPID_SUBJECT'];
          process.exit(required.every(name=>names.has(name))?0:1);
          NODE
          then
            echo 'Stable Web Push VAPID secrets already exist; preserving the current key pair.'
            exit 0
          fi

          node --input-type=module - "$vapid_file" <<'NODE'
          import fs from 'node:fs';
          import { webcrypto } from 'node:crypto';
          const {subtle}=webcrypto;
          const pair=await subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
          const pub=await subtle.exportKey('jwk',pair.publicKey);
          const priv=await subtle.exportKey('jwk',pair.privateKey);
          if(!pub.x||!pub.y||!priv.d)throw new Error('VAPID JWK export failed');
          const fromUrl=value=>Buffer.from(value.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(value.length/4)*4,'='),'base64');
          const publicBytes=Buffer.concat([Buffer.from([4]),fromUrl(pub.x),fromUrl(pub.y)]);
          const publicKey=publicBytes.toString('base64url');
          fs.writeFileSync(process.argv[2],JSON.stringify({
            VAPID_PUBLIC_KEY:publicKey,
            VAPID_PRIVATE_KEY:priv.d,
            VAPID_SUBJECT:'mailto:notifications@salamataval.com'
          }),{mode:0o600});
          NODE

          npx wrangler secret bulk "$vapid_file" --config "$WRANGLER_CONFIG"
          rm -f "$vapid_file"

          npx wrangler secret list --format json --config "$WRANGLER_CONFIG" > "$secret_list"
          node --input-type=module - "$secret_list" <<'NODE'
          import fs from 'node:fs';
          const names=new Set(JSON.parse(fs.readFileSync(process.argv[2],'utf8')).map(item=>item.name));
          const required=['VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','VAPID_SUBJECT'];
          const missing=required.filter(name=>!names.has(name));
          if(missing.length)throw new Error(`Web Push secrets missing after bootstrap: ${missing.join(', ')}`);
          console.log('Caregiver Web Push VAPID secret names verified; secret values were not printed.');
          NODE
          rm -f "$secret_list"
