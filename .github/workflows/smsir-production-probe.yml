name: SMS.ir Production Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smsir-production-probe.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_CONFIG: wrangler.backend.jsonc
  PROBE_PATH: /__ops/smsir-probe-2eOYvvbHVlsqWdzeFTXljPdgXHTjqhAr
  PROBE_URL: https://salamat-aval-caregiver-club.kod-saeid.workers.dev/__ops/smsir-probe-2eOYvvbHVlsqWdzeFTXljPdgXHTjqhAr

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Confirm SMS.ir bindings exist
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --config "$WRANGLER_CONFIG")"
          printf '%s' "$secrets_json" | grep -q 'SMSIR_API_KEY'
          settings="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/salamat-aval-caregiver-club/settings")"
          printf '%s' "$settings" | grep -q 'SMSIR_LINE_NUMBER'
          echo 'SMS.ir API key secret and line-number binding are present.'
      - name: Patch temporary fixed-recipient probe route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/index-desktop-react-v1.ts')
          s=p.read_text()
          imp='import {sendCaregiverNotificationSms} from "./sms-delivery-v1";\n'
          if imp not in s:
              s=imp+s
          needle='    const url = new URL(request.url);const method = request.method.toUpperCase();'
          probe='''\n    if(url.pathname==="/__ops/smsir-probe-2eOYvvbHVlsqWdzeFTXljPdgXHTjqhAr"&&method==="GET"){
      const forcedEnv=new Proxy(env,{get(target,property,receiver){if(property==="SMS_PROVIDER")return "SMSIR";if(property==="SMS_NOTIFICATIONS_ENABLED")return "true";if(property==="SMSIR_NOTIFICATION_TEMPLATE_ID")return "";return Reflect.get(target,property,receiver)}});
      const result=await sendCaregiverNotificationSms(forcedEnv,{recipientUserId:"",caregiverId:"",mobile:"09128668837",title:"تست اتصال پیامک",message:"تست اتصال SMS.ir باشگاه مراقبین سلامت اول",kind:"SMSIR_PROBE"});
      return new Response(JSON.stringify(result),{status:result.ok?200:500,headers:{"content-type":"application/json;charset=UTF-8","cache-control":"no-store"}});
    }'''
          if needle not in s:
              raise SystemExit('probe insertion point not found')
          s=s.replace(needle,needle+probe,1)
          p.write_text(s)
          PY
          npx tsc --noEmit
      - name: Deploy temporary probe, send exactly one SMS, restore canonical worker
        shell: bash
        run: |
          set -u
          restore() {
            git checkout -- worker/index-desktop-react-v1.ts
            npx wrangler deploy --config "$WRANGLER_CONFIG" >/tmp/smsir-restore.log 2>&1 || { cat /tmp/smsir-restore.log; return 1; }
            echo 'Canonical worker restored after probe.'
          }
          trap restore EXIT
          npx wrangler deploy --config "$WRANGLER_CONFIG" >/tmp/smsir-probe-deploy.log 2>&1 || { cat /tmp/smsir-probe-deploy.log; exit 1; }
          http_code="$(curl -sS -o /tmp/smsir-probe-result.json -w '%{http_code}' "$PROBE_URL")"
          cat /tmp/smsir-probe-result.json
          echo
          echo "Probe HTTP status: $http_code"
          test "$http_code" = '200'
