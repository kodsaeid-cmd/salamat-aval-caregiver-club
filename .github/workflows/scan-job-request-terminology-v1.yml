name: Scan Job Request Terminology

on:
  push:
    branches:
      - feat/job-request-unread-terminology-v1
    paths:
      - '.github/workflows/scan-job-request-terminology-v1.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/job-request-unread-terminology-v1
      - name: Scan visible apply terminology
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo '=== Persian apply terms ==='
            git grep -n -I -E 'اپلای|اپلی' -- desktop-react mobile-react worker preview shared scripts || true
            echo
            echo '=== English user-facing Apply/application candidates ==='
            git grep -n -I -E 'Apply|apply|application|applicant' -- desktop-react mobile-react worker preview shared | head -n 1200 || true
          } > ops/job-request-terminology-scan.txt
          cat ops/job-request-terminology-scan.txt
      - name: Publish scan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/job-request-terminology-scan.txt
          git commit -m 'ops: record job request terminology scan' || exit 0
          git push origin HEAD:feat/job-request-unread-terminology-v1
