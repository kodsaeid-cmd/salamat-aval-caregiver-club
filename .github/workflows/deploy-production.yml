name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "preview/**"
      - "mobile-react/**"
      - "desktop-react/**"
      - "shared/**"
      - "migrations/**"
      - "scripts/build-mobile-react.mjs"
      - "scripts/post-deploy-data-safety-v1.mjs"
      - "scripts/validate-caregiver-platform-v1.mjs"
      - "scripts/validate-panel-module-isolation-v2.mjs"
      - "scripts/validate-production-deploy-v3.mjs"
      - "scripts/validate-access-control-v2-production-proof.mjs"
      - "wrangler.backend.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: salamat-aval-production-deploy
  cancel-in-progress: false

env:
  WRANGLER_CONFIG: wrangler.backend.jsonc
  DATABASE_BACKEND: turso
  DEPLOY_ISSUE: "90"
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site
  WORKERS_DOMAIN: https://salamat-aval-caregiver-club.kod-saeid.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application and Turso runtime contracts
        run: |
          npm run typecheck
          node scripts/validate-panel-module-isolation-v2.mjs
          node scripts/validate-production-deploy-v3.mjs
          node scripts/validate-access-control-v2-production-proof.mjs
          node scripts/validate-turso-backend-v1.mjs
          npm run deploy:check

      - name: Block uncoordinated schema changes on Turso primary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-evidence/reports
          changed=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            if [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]]; then
              git fetch --no-tags --depth=1 origin "$base" || true
              changed="$(git diff --name-only "$base" "$GITHUB_SHA" -- migrations/ || true)"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD -- migrations/ || true)"
          fi
          if [[ -n "$changed" ]]; then
            echo "::error::Turso is the production primary database. Migration files changed; apply them through a dedicated Turso migration procedure before deploying runtime code."
            printf '%s\n' "$changed"
            exit 1
          fi
          printf '{"databasePrimary":"turso","gitCommit":"%s","schemaChanges":"none","d1Fallback":"retained"}\n' "$GITHUB_SHA" > production-evidence/reports/database-deploy-guard.json

      - name: Deploy Worker and static assets to Cloudflare
        run: npm run deploy

      - name: Verify live Turso-backed production and hot static path
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {performance} from 'node:perf_hooks';
          const targets=[process.env.WORKERS_DOMAIN,process.env.CUSTOM_DOMAIN];
          const evidence=[];
          for(const base of targets){
            const deadline=Date.now()+180_000;let result=null,last='';
            while(Date.now()<deadline){
              try{
                const version=await fetch(`${base}/api/system/version?deploy=${process.env.GITHUB_SHA}&t=${Date.now()}`,{cache:'no-store'});
                const root=await fetch(`${base}/?deploy=${process.env.GITHUB_SHA}&t=${Date.now()}`,{cache:'no-store'});
                const started=performance.now();
                const asset=await fetch(`${base}/desktop-react-entry-bridge-v1.js?t=${Date.now()}`,{cache:'no-store',headers:{cookie:'salamat_session=invalid-production-probe'}});
                const assetMs=performance.now()-started;
                if(version.ok&&root.ok&&asset.ok&&assetMs<2500){
                  result={base,versionStatus:version.status,rootStatus:root.status,assetStatus:asset.status,assetWithCookieMs:Math.round(assetMs)};
                  break;
                }
                last=JSON.stringify({version:version.status,root:root.status,asset:asset.status,assetMs});
              }catch(error){last=String(error)}
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            if(!result)throw new Error(`Production verification failed for ${base}: ${last}`);
            evidence.push(result);
          }
          const auth=await fetch(`${process.env.CUSTOM_DOMAIN}/api/auth/login`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identifier:'__turso_deploy_probe__',password:'invalid-probe-password'})});
          if(auth.status!==401)throw new Error(`Expected Turso-backed auth probe 401, got ${auth.status}`);
          fs.writeFileSync('production-evidence/reports/deployment.json',JSON.stringify({gitCommit:process.env.GITHUB_SHA,databasePrimary:'turso',authProbeStatus:auth.status,targets:evidence},null,2));
          console.log('Turso-backed production verified on both domains:',evidence);
          NODE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-evidence-${{ github.run_id }}
          path: production-evidence/reports
          retention-days: 90
          if-no-files-found: warn

      - name: Report successful production deployment
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/deploy-comment.md <<EOF
          ### Production Deploy موفق — Turso Primary

          - Commit: \`${GITHUB_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - دیتابیس اصلی Production: Turso؛ D1 فقط به‌عنوان rollback fallback حفظ شده است.
          - Deploy دیگر برای تغییرات صرفاً کدی به Query/Quota روزانه D1 وابسته نیست.
          - مسیر ورود Turso و Asset عمومی با Cookie روی Production بعد از Deploy تأیید شدند.
          EOF
          gh issue comment "$DEPLOY_ISSUE" --body-file /tmp/deploy-comment.md

      - name: Report failed production deployment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/deploy-failure.md <<EOF
          ### Production Deploy ناموفق — Turso Primary

          - Commit: \`${GITHUB_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          انتشار یا تأیید Production کامل نشد؛ تا رفع خطا ادعای انتشار این Commit ممنوع است.
          EOF
          gh issue comment "$DEPLOY_ISSUE" --body-file /tmp/deploy-failure.md
