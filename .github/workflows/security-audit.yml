name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate audit lockfile safely
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit.json
          code=$?
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("audit.json","utf8"));for(const [name,v] of Object.entries(x.vulnerabilities||{})){if(["high","critical"].includes(v.severity))console.log(`::error title=Dependency audit ${name}::${name} severity=${v.severity} range=${v.range} via=${(v.via||[]).map(y=>typeof y==="string"?y:(y.title||y.name||"advisory")).join(" | ")}`)}'
          exit $code
