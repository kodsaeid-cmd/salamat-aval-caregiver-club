name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate audit lockfile safely
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload synchronized audit lockfile
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-package-lock-${{ github.run_id }}
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
