name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(api[_-]?key|secret|token|password)\s*[:=]\s*["'"'][^"'"']{12,}["'"']' -- ':!package-lock.json' ':!SECURITY.md' ':!scripts/validate-security-baseline.mjs'; then
            echo 'Potential hard-coded secret detected. Move secrets to environment variables.' >&2
            exit 1
          fi
