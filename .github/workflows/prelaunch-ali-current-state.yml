name: Prelaunch Ali Current State

on:
  push:
    branches: [audit/prelaunch-approval-diagnostics]
    paths:
      - ".github/workflows/prelaunch-ali-current-state.yml"

permissions:
  contents: read

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Query Ali and matching account state
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT c.id AS caregiverId,c.full_name AS fullName,c.mobile AS caregiverMobile,c.active,c.recruitment_stage AS recruitmentStage,c.cooperation_status AS cooperationStatus,c.membership_code AS membershipCode,u.id AS userId,u.mobile AS userMobile,u.username,upper(u.role) AS userRole,upper(u.status) AS userStatus,CASE WHEN COALESCE(trim(u.password_hash),'')='' THEN 0 ELSE 1 END AS hasPasswordHash,c.updated_at AS caregiverUpdatedAt,u.updated_at AS userUpdatedAt FROM caregivers c LEFT JOIN users u ON u.caregiver_id=c.id AND upper(u.role)='CAREGIVER' AND upper(u.status)<>'DELETED' WHERE c.full_name LIKE '%علی%' AND c.full_name LIKE '%صدرا%' ORDER BY c.created_at DESC;"
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command="$query" --json
