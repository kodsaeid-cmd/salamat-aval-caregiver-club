name: SMSir Line Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smsir-retest.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read configured sender line
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/salamat-aval-caregiver-club/settings")"
          line="$(printf '%s' "$settings" | jq -r '.result.bindings[] | select(.name=="SMSIR_LINE_NUMBER") | (.text // .value // empty)' | head -n1)"
          kind="$(printf '%s' "$settings" | jq -r '.result.bindings[] | select(.name=="SMSIR_LINE_NUMBER") | .type' | head -n1)"
          echo "SMSIR_LINE_NUMBER_TYPE=$kind"
          echo "SMSIR_LINE_NUMBER_VALUE=$line"
          test -n "$line"
