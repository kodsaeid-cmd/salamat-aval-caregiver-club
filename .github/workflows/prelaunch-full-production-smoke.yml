name: Prelaunch Full Production Smoke
# prelaunch rerun after PR #181 / 11-module smoke gate

on:
  push:
    branches: [audit/prelaunch-approval-diagnostics]
    paths:
      - ".github/workflows/prelaunch-full-production-smoke.yml"

permissions:
  contents: read

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main smoke contracts
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated Chromium smoke dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Re-run static launch gates
        run: |
          npm run typecheck
          node scripts/validate-self-registration-approval-v2.mjs
          node scripts/validate-access-control-v2-production-proof.mjs
          node scripts/validate-render-module-owner-guard-v1.mjs
          node scripts/validate-otp-sms-notifications-v1.mjs
          node scripts/validate-panel-module-isolation-v2.mjs
          node scripts/validate-production-deploy-v3.mjs
      - name: Prepare isolated production fixtures
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          mkdir -p .admin-core-smoke
          node scripts/prepare-release-smoke-fixtures.mjs .admin-core-smoke "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$password"
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --file=.admin-core-smoke/fixtures.sql
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Run authenticated API and contract lifecycle smoke
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-priority-api-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json
      - name: Run linked pending registration approval smoke
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-self-registration-production-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json
      - name: Run real Chromium admin module smoke
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-priority-browser-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json
      - name: Cleanup isolated production fixtures
        if: always() && steps.fixtures.outputs.created == 'true'
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --file=.admin-core-smoke/cleanup.sql
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-full-production-smoke-${{ github.run_id }}
          path: |
            .admin-core-smoke/priority-api-result.json
            .admin-core-smoke/self-registration-approval-result.json
            .admin-core-smoke/priority-browser-result.json
            .admin-core-smoke/priority-browser-failure.json
            .admin-core-smoke/priority-router.png
            .admin-core-smoke/priority-router-failure.png
          retention-days: 90
          if-no-files-found: warn
