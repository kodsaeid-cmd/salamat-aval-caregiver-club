name: Inspect Prod 284 Side

on:
  push:
    branches:
      - feat/job-request-unread-terminology-v1
    paths:
      - '.github/workflows/inspect-prod-284-side.yml'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/job-request-unread-terminology-v1
      - name: Inspect target production run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          target='b6edff52fd53fce1709b0bad9918175f5068281d'
          run_id=''
          for i in $(seq 1 70); do
            runs="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$target&per_page=50")"
            run_id="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.name=="Mobile React Production Deploy") | .id' | head -n1)"
            if [ -n "$run_id" ]; then
              state="$(printf '%s' "$runs" | jq -r --argjson id "$run_id" '.workflow_runs[]|select(.id==$id)|.status')"
              echo "run=$run_id status=$state"
              [ "$state" = completed ] && break
            fi
            sleep 5
          done
          test -n "$run_id"
          run="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          jobs="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=20")"
          { printf '%s' "$run" | jq '{id,name,status,conclusion,run_number,run_attempt,head_sha,created_at,updated_at}'; printf '%s' "$jobs" | jq '{jobs:[.jobs[]|{id,name,status,conclusion,steps:[.steps[]|{name,status,conclusion,number}]}]}'; } > ops/prod-284-side-result.txt
          cat ops/prod-284-side-result.txt
      - name: Publish result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/prod-284-side-result.txt
          git commit -m 'ops: record production 284 side result' || exit 0
          git push origin HEAD:feat/job-request-unread-terminology-v1
