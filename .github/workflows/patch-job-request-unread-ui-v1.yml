name: Patch Job Request Unread UI

on:
  push:
    branches:
      - feat/job-request-unread-terminology-v1
    paths:
      - '.github/workflows/patch-job-request-unread-ui-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/job-request-unread-terminology-v1
      - name: Apply patch
        run: python scripts/patch-job-request-unread-ui-v1.py
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add worker desktop-react mobile-react preview shared scripts
          git commit -m 'feat: add unread job request indicators and terminology' || exit 0
          git push origin HEAD:feat/job-request-unread-terminology-v1
