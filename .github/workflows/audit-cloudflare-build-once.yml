name: Audit Cloudflare build once

on:
  push:
    branches:
      - fix/cloudflare-invalid-lockfile
    paths:
      - .github/workflows/audit-cloudflare-build-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/audit-cloudflare-build-once.yml

permissions:
  contents: read

jobs:
  audit-cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_BRANCH: fix/cloudflare-invalid-lockfile
    steps:
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]]
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]

      - name: Read latest Cloudflare build status
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          scripts_json="$(curl --fail --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          worker_tag="$(jq -r '.result[] | select(.id == "salamat-aval-caregiver-club") | .tag' <<<"$scripts_json" | head -n1)"
          [[ -n "$worker_tag" && "$worker_tag" != "null" ]]

          builds_json="$(curl --fail --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/workers/$worker_tag/builds")"

          jq -e --arg branch "$TARGET_BRANCH" '
            [(.result.builds // .result // [])[]
              | select((.build_trigger_metadata.branch // .branch // "") == $branch)]
            | sort_by(.created_at // .created_on // "")
            | reverse
            | .[0]
            | {
                build_uuid: (.build_uuid // .uuid // .id),
                status: (.status // .state),
                branch: (.build_trigger_metadata.branch // .branch),
                commit_hash: (.build_trigger_metadata.commit_hash // .commit_hash),
                created_at: (.created_at // .created_on),
                completed_at: (.completed_at // .modified_at // .modified_on)
              }
          ' <<<"$builds_json" | tee /tmp/cloudflare-build-summary.json

          jq -e '.build_uuid != null and .status != null' /tmp/cloudflare-build-summary.json >/dev/null
          {
            echo '### Cloudflare build audit'
            echo '```json'
            cat /tmp/cloudflare-build-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
