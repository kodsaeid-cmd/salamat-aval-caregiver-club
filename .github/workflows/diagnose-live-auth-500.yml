name: Diagnose Live Auth 500

on:
  push:
    branches: [diag/live-auth-500-tail]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site

jobs:
  tail-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
      - name: Capture Worker exception for fake login probe
        shell: bash
        run: |
          set -u
          rm -f /tmp/tail.log /tmp/probe.body
          timeout 30s npx wrangler tail salamat-aval-caregiver-club --format pretty > /tmp/tail.log 2>&1 &
          tail_pid=$!
          sleep 7
          status="$(curl -sS -o /tmp/probe.body -w '%{http_code}' -X POST "$CUSTOM_DOMAIN/api/auth/login" -H 'Content-Type: application/json' --data '{"identifier":"__diagnostic_invalid_user__","password":"invalid-diagnostic-password"}')"
          echo "AUTH_PROBE_STATUS=$status"
          echo "AUTH_PROBE_BODY_BEGIN"
          cat /tmp/probe.body
          echo
          echo "AUTH_PROBE_BODY_END"
          sleep 7
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo "WORKER_TAIL_BEGIN"
          cat /tmp/tail.log
          echo "WORKER_TAIL_END"
