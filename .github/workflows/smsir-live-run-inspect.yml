name: SMSir Live Run Inspect

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/smsir-live-run-inspect.yml

permissions:
  contents: write
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  TEST_HEAD_SHA: bedfe1e8b1f981079718ea622af341a2b3afafb1

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect run
        shell: bash
        run: |
          set -euo pipefail
          runs="$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TEST_HEAD_SHA&per_page=20")"
          run_id="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.name=="SMSir Activation Live Test" or .name==".github/workflows/smsir-activation-live-test.yml") | .id' | head -n1)"
          mkdir -p ops
          printf '%s' "$runs" | jq '{workflow_runs:[.workflow_runs[]|{id,name,status,conclusion,event,head_sha,created_at,updated_at}]}' > ops/smsir-live-run-status.txt
          if [ -n "$run_id" ]; then
            echo >> ops/smsir-live-run-status.txt
            curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=20" | jq '{jobs:[.jobs[]|{id,name,status,conclusion,started_at,completed_at,steps:[.steps[]|{name,status,conclusion,number}]}]}' >> ops/smsir-live-run-status.txt
          fi
          cat ops/smsir-live-run-status.txt
      - name: Publish result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/smsir-live-run-status.txt
          git commit -m "ops: record SMS.ir live run status" || exit 0
          git push
