name: Auth Surface Gate

on:
  pull_request:
    paths:
      - 'preview/auth-surface-gate-v1.js'
      - 'worker/index-referral-rewards.ts'
      - 'scripts/validate-auth-surface-gate-v1.mjs'
      - '.github/workflows/auth-surface-gate.yml'
  push:
    branches: [main]
    paths:
      - 'preview/auth-surface-gate-v1.js'
      - 'worker/index-referral-rewards.ts'
      - 'scripts/validate-auth-surface-gate-v1.mjs'
      - '.github/workflows/auth-surface-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser runtime syntax
        run: node --check preview/auth-surface-gate-v1.js
      - name: Validate surface isolation contract
        run: node scripts/validate-auth-surface-gate-v1.mjs
      - name: Typecheck worker integration
        run: npm ci && npx tsc --noEmit
