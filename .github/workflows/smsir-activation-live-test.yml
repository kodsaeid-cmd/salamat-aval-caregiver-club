name: SMSir Activation Live Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/smsir-activation-live-test.yml

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_CONFIG: wrangler.backend.jsonc
  PROBE_URL: https://salamat-aval-caregiver-club.kod-saeid.workers.dev/__ops/smsir-activation-live-test-8kP2sX7mQ4vN6cR1

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Patch probe
        run: python scripts/smsir-activation-live-test-patch.py
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Deploy probe and send one SMS
        shell: bash
        run: |
          set -u
          restore() {
            git checkout -- worker/index-desktop-react-v1.ts
            npx wrangler deploy --config "$WRANGLER_CONFIG" >/tmp/smsir-activation-restore.log 2>&1 || {
              cat /tmp/smsir-activation-restore.log
              return 1
            }
            echo "Canonical worker restored."
          }
          trap restore EXIT

          npx wrangler deploy --config "$WRANGLER_CONFIG" >/tmp/smsir-activation-deploy.log 2>&1 || {
            cat /tmp/smsir-activation-deploy.log
            exit 1
          }

          code=404
          for attempt in 1 2 3 4 5 6 7 8; do
            sleep 2
            code="$(curl -sS -o /tmp/smsir-activation-result.json -w '%{http_code}' "$PROBE_URL")"
            echo "Activation test attempt $attempt HTTP status: $code"
            if [ "$code" != "404" ]; then
              break
            fi
          done

          cat /tmp/smsir-activation-result.json || true
          echo

          restore
          trap - EXIT

          mkdir -p ops
          {
            echo "http_code=$code"
            cat /tmp/smsir-activation-result.json
          } > ops/smsir-activation-live-test-response.txt

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/smsir-activation-live-test-response.txt
          git commit -m "ops: record SMS.ir activation live response" || true
          git push

          test "$code" = "200"
