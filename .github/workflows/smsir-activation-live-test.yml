name: SMSir Activation Live Test Result

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smsir-activation-live-test.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_CONFIG: wrangler.backend.jsonc
  DB_NAME: salamat-aval-caregiver-club

jobs:
  inspect-result:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Inspect template binding and test delivery log
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/salamat-aval-caregiver-club/settings")"
          template_type="$(printf '%s' "$settings" | jq -r '.result.bindings[] | select(.name=="SMSIR_ACTIVATION_TEMPLATE_ID") | .type' | head -n1)"
          if [ -n "$template_type" ]; then template_configured=true; else template_configured=false; fi
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" --command "SELECT message_kind,provider,status,provider_message_id,error_code,created_at FROM sms_delivery_log WHERE message_kind='PROFILE_ACTIVATED_LIVE_TEST' ORDER BY created_at DESC LIMIT 3;" --json > /tmp/smsir-activation-log.json
          mkdir -p ops
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "SMSIR_ACTIVATION_TEMPLATE_ID_configured=$template_configured"
            echo "SMSIR_ACTIVATION_TEMPLATE_ID_binding_type=${template_type:-missing}"
            echo "delivery_log_json="
            cat /tmp/smsir-activation-log.json
          } > ops/smsir-activation-live-test-result.txt
          cat ops/smsir-activation-live-test-result.txt
      - name: Publish inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/smsir-activation-live-test-result.txt
          git commit -m "ops: record SMS.ir activation test result" || exit 0
          git push
