name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck and preview validation
        run: npm run typecheck

      - name: Validate caregiver directory filters and sorting
        run: node scripts/validate-caregiver-directory-filters-v1.mjs

      - name: Validate loan and retention reward policy
        run: node scripts/validate-loan-retention-policy-v1.mjs

      - name: Build mobile and desktop React bundles
        run: node scripts/build-mobile-react.mjs

      - name: Validate training content management
        run: node scripts/validate-training-content-management-v1.mjs

      - name: Validate training taxonomy v2
        run: node scripts/validate-training-taxonomy-v2.mjs

      - name: Validate training exam evaluation v1
        run: node scripts/validate-training-exam-evaluation-v1.mjs

      - name: Validate admin-only contract deletion
        run: node scripts/validate-admin-contract-delete-v1.mjs

      - name: Validate private initial caregiver evaluation
        run: node scripts/validate-initial-caregiver-evaluation-v1.mjs

      - name: Validate self-registration approval v2
        run: node scripts/validate-self-registration-approval-v2.mjs

      - name: Validate production smoke syntax
        run: |
          node --check scripts/prepare-release-smoke-fixtures.mjs
          node --check scripts/run-admin-priority-api-smoke.mjs
          node --check scripts/run-admin-priority-browser-smoke.mjs
          node --check scripts/run-self-registration-production-smoke.mjs

      - name: Validate OTP, SMS and caregiver notifications
        run: node scripts/validate-otp-sms-notifications-v1.mjs

      - name: Validate panel module isolation and access v2
        run: node scripts/validate-panel-module-isolation-v2.mjs

      - name: Validate production deploy v3 contract
        run: node scripts/validate-production-deploy-v3.mjs

      - name: Validate access v2 API and browser proof
        run: node scripts/validate-access-control-v2-production-proof.mjs

      - name: Cloudflare static assets build
        run: npm run build

      - name: Cloudflare Workers deployment dry run
        run: npm run deploy:check

      - name: Next.js application build
        run: npm run build:web

  diagnose-primary-owner:
    if: github.event_name == 'pull_request' && github.head_ref == 'diag/primary-owner-login-500'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TURSO_DATABASE_NAME: salamat-aval-caregiver-club
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      BASE_SHA: 6446f86aefaad864e4933b2a9425e78327eac716
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Inspect owner account without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$TURSO_PLATFORM_API_TOKEN" ]] || { echo "::error::TURSO_PLATFORM_API_TOKEN is missing"; exit 1; }
          target_identifier="$(git show "$BASE_SHA" --no-patch --format=%ae | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')"
          [[ -n "$target_identifier" ]] || { echo "::error::Could not resolve the owner identifier"; exit 1; }
          echo "::add-mask::$target_identifier"
          TARGET_IDENTIFIER="$target_identifier" node <<'NODE'
          const token=String(process.env.TURSO_PLATFORM_API_TOKEN||'').trim();
          const dbName=String(process.env.TURSO_DATABASE_NAME||'salamat-aval-caregiver-club').trim();
          const target=String(process.env.TARGET_IDENTIFIER||'').trim().toLowerCase();
          if(!token||!target) throw new Error('Missing diagnostic inputs.');
          async function platform(path,options={}){
            const r=await fetch(`https://api.turso.tech/v1${path}`,{...options,headers:{Authorization:`Bearer ${token}`,...(options.headers||{})}});
            const t=await r.text(); let p=null; try{p=t?JSON.parse(t):null}catch{}
            if(!r.ok) throw new Error(`Turso platform request failed: HTTP ${r.status}`);
            return p;
          }
          const orgPayload=await platform('/organizations');
          const orgs=Array.isArray(orgPayload)?orgPayload:Array.isArray(orgPayload?.organizations)?orgPayload.organizations:[];
          const org=orgs.find(x=>x?.type==='personal')||orgs[0];
          const slug=String(org?.slug||'').trim();
          if(!slug) throw new Error('No Turso organization available.');
          const dbPayload=await platform(`/organizations/${encodeURIComponent(slug)}/databases/${encodeURIComponent(dbName)}`);
          const db=dbPayload?.database||dbPayload||{};
          const hostname=String(db.Hostname||db.hostname||db.host||'').trim();
          if(!hostname) throw new Error('No Turso hostname returned.');
          const tokPayload=await platform(`/organizations/${encodeURIComponent(slug)}/databases/${encodeURIComponent(dbName)}/auth/tokens?expiration=10m&authorization=full-access`,{method:'POST'});
          const dbToken=String(tokPayload?.jwt||'').trim();
          if(!dbToken) throw new Error('No temporary Turso token returned.');
          console.log(`::add-mask::${dbToken}`);
          const escaped=target.replaceAll("'","''");
          const queries=[
            `SELECT id,username,role,status,permissions_json,password_hash,last_login_at,updated_at FROM users WHERE lower(username)='${escaped}' LIMIT 1`,
            `SELECT COUNT(*) AS count FROM sessions WHERE user_id=(SELECT id FROM users WHERE lower(username)='${escaped}' LIMIT 1)`,
            `PRAGMA table_info(users)`,
            `PRAGMA table_info(sessions)`
          ];
          const requests=queries.map(sql=>({type:'execute',stmt:{sql}})); requests.push({type:'close'});
          const r=await fetch(`https://${hostname}/v2/pipeline`,{method:'POST',headers:{Authorization:`Bearer ${dbToken}`,'Content-Type':'application/json'},body:JSON.stringify({requests})});
          const payload=await r.json().catch(()=>null);
          if(!r.ok) throw new Error(`Turso pipeline failed: HTTP ${r.status}`);
          const results=Array.isArray(payload?.results)?payload.results:[];
          const error=results.find(x=>x?.type==='error'); if(error) throw new Error(`SQL diagnostic failed: ${error.error?.message||error.error?.code||'unknown'}`);
          const rows=(idx)=>results[idx]?.response?.result?.rows||[];
          const cols=(idx)=>results[idx]?.response?.result?.cols?.map(x=>x.name)||[];
          const rowObj=(idx,row)=>Object.fromEntries(cols(idx).map((c,i)=>[c,row?.[i]?.value ?? row?.[i] ?? null]));
          const accountRows=rows(0); const account=accountRows[0]?rowObj(0,accountRows[0]):null;
          const userColumns=new Set(rows(2).map(r=>rowObj(2,r).name));
          const sessionColumns=new Set(rows(3).map(r=>rowObj(3,r).name));
          let permissionsValid=false, permissionsArray=false, rootMarker=false;
          if(account){try{const parsed=JSON.parse(String(account.permissions_json??'[]'));permissionsValid=true;permissionsArray=Array.isArray(parsed);rootMarker=Array.isArray(parsed)&&parsed.map(String).includes('*')}catch{}}
          const hash=String(account?.password_hash||'');
          const parts=hash.split('$');
          const iterations=Number(parts[1]||0);
          const passwordFormatValid=parts.length===4&&parts[0]==='pbkdf2-sha256'&&iterations>=50000&&iterations<=100000&&/^[0-9a-f]+$/i.test(parts[2]||'')&&/^[0-9a-f]+$/i.test(parts[3]||'');
          const sessionCountRow=rows(1)[0]?rowObj(1,rows(1)[0]):{};
          const report={accountFound:Boolean(account),role:account?.role||null,status:account?.status||null,protectedRootMarker:rootMarker,permissionsJsonValid:permissionsValid,permissionsIsArray:permissionsArray,passwordFormatValid,passwordIterations:Number.isFinite(iterations)?iterations:null,hasLastLoginColumn:userColumns.has('last_login_at'),hasUpdatedAtColumn:userColumns.has('updated_at'),sessionsSchemaReady:['id','user_id','token_hash','expires_at','created_at','last_seen_at'].every(c=>sessionColumns.has(c)),activeSessionCount:Number(sessionCountRow.count||0),hasRecordedLastLogin:Boolean(account?.last_login_at)};
          console.log(JSON.stringify(report));
          if(!account) process.exitCode=2;
          NODE
