name: Admin Core Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/staff-payroll-v1.ts"
      - "worker/admin-system-tools-v1.ts"
      - "worker/panel-access-contract-v2.ts"
      - "worker/caregiver-platform-catalog.ts"
      - "worker/index-caregiver-platform-v1.ts"
      - "preview/staff-module-router-v3.js"
      - "preview/staff-financial-credits-runtime-v2.js"
      - "preview/staff-payroll-runtime-v1.js"
      - "preview/staff-system-settings-runtime-v1.js"
      - "scripts/run-admin-core-production-smoke.mjs"
      - "scripts/run-admin-ui-browser-smoke.mjs"
      - ".github/workflows/admin-core-production-smoke.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: salamat-aval-admin-core-production-smoke
  cancel-in-progress: false

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site
  VERIFY_ISSUE: "96"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then
            printf '::error::Missing repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate smoke script syntax
        run: |
          node --check scripts/run-admin-core-production-smoke.mjs
          node --check scripts/run-admin-ui-browser-smoke.mjs

      - name: Prepare isolated admin identity
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          mkdir -p .admin-core-smoke
          node scripts/prepare-release-smoke-fixtures.mjs \
            .admin-core-smoke "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$password"
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" \
            --file=.admin-core-smoke/fixtures.sql
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Run authenticated admin API smoke
        shell: bash
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-core-production-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Run real browser icon and module-click smoke
        shell: bash
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-ui-browser-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Remove isolated admin identities
        if: always() && steps.fixtures.outputs.created == 'true'
        shell: bash
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" \
            --file=.admin-core-smoke/cleanup.sql || true
          rm -f .admin-core-smoke/fixtures.sql .admin-core-smoke/cleanup.sql .admin-core-smoke/meta.json

      - name: Upload authenticated browser evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin-core-production-smoke-${{ github.run_id }}
          path: |
            .admin-core-smoke/result.json
            .admin-core-smoke/browser-result.json
            .admin-core-smoke/admin-router-v4.png
          retention-days: 90
          if-no-files-found: error

      - name: Report successful authenticated smoke
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/admin-core-success.md <<EOF
          ### تست واقعی مرورگر Admin Router v4 موفق

          - Commit: \`${GITHUB_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - دامنه اصلی Header نسخه \`x-salamat-admin-router: 4.0.0\` و Runtimeهای \`2.1.0\` را برگرداند.
          - حساب موقت ادمین با موفقیت وارد شد و پس از تست پاک شد.
          - تمام آیکون‌های منو wrapper اصلی \`data-icon\`، خط دور و \`fill:none\` داشتند.
          - منو در حالت بیکار بازسازی تکراری نداشت.
          - کلیک واقعی «اعتبارات مالی» صفحه اعتبارات مالی مراقبین را باز کرد.
          - کلیک واقعی «حقوق و پرداخت» صفحه حقوق و پرداخت مراقبین را باز کرد.
          - کلیک واقعی «بانک آموزش» محتوای کامل مدیریت آموزش را باز کرد.
          - «کاربران و دسترسی‌ها» از وضعیت Loading خارج شد و خطا نداد.
          - «گزارش‌ها» در منو و ماتریس دسترسی وجود نداشت.
          - Screenshot و نتیجه زمان‌بندی مرورگر با نگهداری ۹۰ روز ثبت شد.
          EOF
          gh issue comment "$VERIFY_ISSUE" --body-file /tmp/admin-core-success.md

      - name: Report failed authenticated smoke
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/admin-core-failure.md <<EOF
          ### تست واقعی مرورگر Admin Router v4 ناموفق

          - Commit: \`${GITHUB_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          یکی از موارد آیکون‌های اصلی، ثبات منو، کلیک اعتبارات مالی، حقوق و پرداخت، بانک آموزش یا خروج کاربران از Loading تأیید نشد. تا رفع خطا ادعای تحویل ممنوع است.
          EOF
          gh issue comment "$VERIFY_ISSUE" --body-file /tmp/admin-core-failure.md
