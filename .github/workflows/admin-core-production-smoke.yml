name: Admin Core Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-core-production-smoke.yml"
      - "scripts/prepare-release-smoke-fixtures.mjs"
      - "scripts/execute-turso-statements-v1.mjs"
      - "scripts/run-admin-priority-api-smoke.mjs"
      - "scripts/run-admin-priority-browser-smoke.mjs"
      - "scripts/run-admin-priority-browser-smoke-v2.mjs"
      - "scripts/run-self-registration-production-smoke.mjs"
  workflow_run:
    workflows: ["Production Deploy"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: salamat-aval-admin-core-production-smoke
  cancel-in-progress: false

env:
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site
  VERIFY_ISSUE: "104"
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TURSO_DATABASE_NAME: salamat-aval-caregiver-club
  TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}

jobs:
  authenticated-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Require Turso production smoke credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$TURSO_PLATFORM_API_TOKEN" ]] || { echo "::error::Missing TURSO_PLATFORM_API_TOKEN repository secret."; exit 1; }
          [[ -n "$TURSO_DATABASE_NAME" ]] || { echo "::error::Missing TURSO_DATABASE_NAME."; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate priority smoke syntax
        run: |
          node --check scripts/prepare-release-smoke-fixtures.mjs
          node --check scripts/execute-turso-statements-v1.mjs
          node --check scripts/run-admin-priority-api-smoke.mjs
          node --check scripts/run-admin-priority-browser-smoke.mjs
          node --check scripts/run-admin-priority-browser-smoke-v2.mjs
          node --check scripts/run-self-registration-production-smoke.mjs
          node scripts/validate-self-registration-approval-v2.mjs
          node scripts/validate-render-module-owner-guard-v1.mjs
          node scripts/validate-access-control-v2-production-proof.mjs

      - name: Prepare isolated admin and caregiver identities in Turso
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          mkdir -p .admin-core-smoke
          node scripts/prepare-release-smoke-fixtures.mjs \
            .admin-core-smoke "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$password"
          node scripts/execute-turso-statements-v1.mjs .admin-core-smoke/fixtures.json
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Run authenticated head-first API smoke
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-priority-api-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Run linked self-registration approval smoke
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-self-registration-production-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Run real browser head-first smoke
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-priority-browser-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Remove isolated admin and caregiver identities from Turso
        if: always() && steps.fixtures.outputs.created == 'true'
        run: |
          node scripts/execute-turso-statements-v1.mjs .admin-core-smoke/cleanup.json
          rm -f .admin-core-smoke/fixtures.sql .admin-core-smoke/cleanup.sql \
            .admin-core-smoke/fixtures.json .admin-core-smoke/cleanup.json .admin-core-smoke/meta.json

      - name: Upload head-first browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-head-first-production-smoke-${{ github.run_id }}
          path: |
            .admin-core-smoke/priority-api-result.json
            .admin-core-smoke/self-registration-approval-result.json
            .admin-core-smoke/priority-browser-result.json
            .admin-core-smoke/priority-browser-failure.json
            .admin-core-smoke/priority-router.png
            .admin-core-smoke/priority-router-failure.png
          retention-days: 90
          if-no-files-found: warn

      - name: Report successful head-first smoke
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/success.md <<EOF
          ### تست واقعی قراردادها، تأیید ثبت‌نام مستقیم و Head-first Router موفق — Turso Primary

          - Commit: \`${TARGET_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Fixtureهای ایزوله مستقیماً روی Turso Production ساخته و پس از تست پاک‌سازی شدند؛ D1 در این Smoke دخیل نبود.
          - نسخه زنده \`Platform 2.4.0 / Router 5.0.0 / Access 2.0.0 / Contracts 1.0.0 / Contract Owner 2.0.0\` تأیید شد.
          - ثبت‌نام مستقیم با حساب از قبل ساخته‌شده و وضعیت PENDING به‌صورت واقعی تأیید، ACTIVE و از صف انتظار خارج شد؛ همان حساب بعد از تأیید Login موفق داشت.
          - جست‌وجوی مراقب، ایجاد قرارداد، کپی سروری «همان مشترک»، ویرایش و Audit واقعی موفق بود.
          - هفت روز قرارداد در تقویم حساب همان مراقب به‌صورت رویداد هفتگی فقط‌خواندنی دیده شد و پس از حذف قرارداد پاک شد.
          - Runtime مستقیم پشتیبانی، منو، آیکون‌ها، اعتبارات مالی، حقوق و پرداخت، آموزش و کاربران/دسترسی‌ها با کلیک واقعی مرورگر تأیید شدند.
          EOF
          gh issue comment "$VERIFY_ISSUE" --body-file /tmp/success.md

      - name: Report failed head-first smoke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/failure.md <<EOF
          ### تست واقعی قراردادها، ثبت‌نام مستقیم یا Head-first Router ناموفق — Turso Primary

          - Commit: \`${TARGET_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Smoke احرازشده روی Turso Production کامل نشد. Fixtureها با توکن کوتاه‌عمر دیتابیس اجرا و Cleanup تلاش شده است؛ تا رفع خطا ادعای تحویل این Smoke ممنوع است.
          EOF
          gh issue comment "$VERIFY_ISSUE" --body-file /tmp/failure.md
