name: Admin Core Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/index-caregiver-platform-v1.ts"
      - "worker/index-data-protection.ts"
      - "worker/panel-access-contract-v2.ts"
      - "preview/access-control-runtime-v2.js"
      - "preview/staff-module-router-v3.js"
      - "preview/staff-financial-credits-runtime-v2.js"
      - "preview/staff-payroll-runtime-v1.js"
      - "preview/staff-system-settings-runtime-v1.js"
      - "preview/staff-support-runtime-v1.js"
      - "scripts/run-admin-api-smoke-v2.mjs"
      - "scripts/run-admin-ui-browser-smoke-v2.mjs"
      - ".github/workflows/admin-core-production-smoke.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: salamat-aval-admin-core-production-smoke
  cancel-in-progress: false

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site
  VERIFY_ISSUE: "101"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then
            printf '::error::Missing repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate direct sidebar smoke syntax
        run: |
          node --check scripts/run-admin-api-smoke-v2.mjs
          node --check scripts/run-admin-ui-browser-smoke-v2.mjs

      - name: Prepare isolated admin identity
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          mkdir -p .admin-core-smoke
          node scripts/prepare-release-smoke-fixtures.mjs \
            .admin-core-smoke "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$password"
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" \
            --file=.admin-core-smoke/fixtures.sql
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Run authenticated router v5 API smoke
        shell: bash
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-api-smoke-v2.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Run real browser router v5 smoke
        shell: bash
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-ui-browser-smoke-v2.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Remove isolated admin identities
        if: always() && steps.fixtures.outputs.created == 'true'
        shell: bash
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" \
            --file=.admin-core-smoke/cleanup.sql || true
          rm -f .admin-core-smoke/fixtures.sql .admin-core-smoke/cleanup.sql .admin-core-smoke/meta.json

      - name: Upload router v5 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-router-v5-production-smoke-${{ github.run_id }}
          path: |
            .admin-core-smoke/result-v2.json
            .admin-core-smoke/browser-result-v2.json
            .admin-core-smoke/browser-failure-v2.json
            .admin-core-smoke/access-control-v2.png
            .admin-core-smoke/access-control-v2-failure.png
          retention-days: 90
          if-no-files-found: warn

      - name: Report successful router v5 smoke
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/router-v5-success.md <<EOF
          ### تست واقعی Direct Sidebar Router v5 موفق

          - Commit: \`${GITHUB_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - دامنه اصلی نسخه‌های \`Platform 2.3.0\`، \`Router 5.0.0\` و \`Access Control 2.0.0\` را برگرداند.
          - خود URL تمام Runtimeهای اصلی با Status 200 و محتوای JavaScript دریافت شد.
          - Router بدون استفاده از \`renderNav\` قدیمی دقیقاً ۱۰ ماژول را مستقیماً ساخت.
          - «اعتبارات مالی» و «پشتیبانی» در Sidebar پایدار باقی ماندند.
          - آیکون‌های اصلی خطی با wrapper \`data-icon\` و \`fill:none\` تأیید شدند.
          - Sidebar در حالت بیکار بازسازی تکراری نداشت.
          - کلیک واقعی اعتبارات مالی، حقوق و پرداخت، بانک آموزش و پشتیبانی محتوای مستقل را باز کرد.
          - کاربران و دسترسی‌ها از Loading خارج شد و حساب‌ها را دریافت کرد.
          - حساب موقت تست پاک و Screenshot و زمان‌بندی‌ها در Artifact ۹۰روزه ثبت شد.
          EOF
          gh issue comment "$VERIFY_ISSUE" --body-file /tmp/router-v5-success.md

      - name: Report failed router v5 smoke
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/router-v5-failure.md <<EOF
          ### تست واقعی Direct Sidebar Router v5 ناموفق

          - Commit: \`${GITHUB_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ثبات ۱۰ ماژول، آیکون‌ها، Runtimeهای زنده یا کلیک‌های واقعی تأیید نشد. JSON تشخیصی و Screenshot شکست در Artifact ذخیره شده‌اند؛ تا رفع خطا ادعای تحویل ممنوع است.
          EOF
          gh issue comment "$VERIFY_ISSUE" --body-file /tmp/router-v5-failure.md
