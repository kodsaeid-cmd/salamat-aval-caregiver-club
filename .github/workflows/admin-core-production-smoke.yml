name: Admin Core Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/index-caregiver-platform-v1.ts"
      - "worker/index-data-protection.ts"
      - "worker/index-desktop-react-v1.ts"
      - "worker/index-caregiver-onboarding-v2.ts"
      - "worker/self-registered-approval-v1.ts"
      - "worker/staff-contracts-v1.ts"
      - "worker/contract-calendar-overlay-v1.ts"
      - "desktop-react/users-dashboard-v2.tsx"
      - "mobile-react/admin-job-ads-v3.tsx"
      - "mobile-react/admin-caregivers-v4.tsx"
      - "shared/caregiver-mobile-scorecard-tabs-v1.ts"
      - "preview/contract-module-priority-v1.js"
      - "preview/staff-contracts-runtime-v1.js"
      - "preview/access-control-runtime-v2.js"
      - "preview/staff-module-router-v3.js"
      - "preview/render-module-owner-guard-v1.js"
      - "preview/staff-support-direct-runtime-v2.js"
      - "preview/staff-financial-credits-runtime-v2.js"
      - "preview/staff-payroll-runtime-v1.js"
      - "preview/staff-system-settings-runtime-v1.js"
      - "migrations/0101_operational_contracts.sql"
      - "scripts/prepare-release-smoke-fixtures.mjs"
      - "scripts/run-admin-priority-api-smoke.mjs"
      - "scripts/run-admin-priority-browser-smoke.mjs"
      - "scripts/run-self-registration-production-smoke.mjs"
      - "scripts/validate-self-registration-approval-v2.mjs"
      - "scripts/validate-render-module-owner-guard-v1.mjs"
      - ".github/workflows/admin-core-production-smoke.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: salamat-aval-admin-core-production-smoke
  cancel-in-progress: false

env:
  DB_NAME: salamat-aval-caregiver-club
  WRANGLER_CONFIG: wrangler.backend.jsonc
  CUSTOM_DOMAIN: https://salamatavalcaregivers.site
  VERIFY_ISSUE: "104"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then
            printf '::error::Missing repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate priority smoke syntax
        run: |
          node --check scripts/prepare-release-smoke-fixtures.mjs
          node --check scripts/run-admin-priority-api-smoke.mjs
          node --check scripts/run-admin-priority-browser-smoke.mjs
          node --check scripts/run-self-registration-production-smoke.mjs
          node scripts/validate-self-registration-approval-v2.mjs
          node scripts/validate-render-module-owner-guard-v1.mjs

      - name: Prepare isolated admin and caregiver identities
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          mkdir -p .admin-core-smoke
          node scripts/prepare-release-smoke-fixtures.mjs \
            .admin-core-smoke "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$password"
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" \
            --file=.admin-core-smoke/fixtures.sql
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Run authenticated head-first API smoke
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-priority-api-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Run linked self-registration approval smoke
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-self-registration-production-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Run real browser head-first smoke
        env:
          ADMIN_CORE_SMOKE_PASSWORD: ${{ steps.fixtures.outputs.password }}
        run: node scripts/run-admin-priority-browser-smoke.mjs "$CUSTOM_DOMAIN" .admin-core-smoke/meta.json

      - name: Remove isolated admin and caregiver identities
        if: always() && steps.fixtures.outputs.created == 'true'
        run: |
          npx wrangler d1 execute "$DB_NAME" --remote --config "$WRANGLER_CONFIG" \
            --file=.admin-core-smoke/cleanup.sql
          rm -f .admin-core-smoke/fixtures.sql .admin-core-smoke/cleanup.sql .admin-core-smoke/meta.json

      - name: Upload head-first browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-head-first-production-smoke-${{ github.run_id }}
          path: |
            .admin-core-smoke/priority-api-result.json
            .admin-core-smoke/self-registration-approval-result.json
            .admin-core-smoke/priority-browser-result.json
            .admin-core-smoke/priority-browser-failure.json
            .admin-core-smoke/priority-router.png
            .admin-core-smoke/priority-router-failure.png
          retention-days: 90
          if-no-files-found: warn

      - name: Report successful head-first smoke
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/success.md <<EOF
          ### تست واقعی قراردادها، تأیید ثبت‌نام مستقیم و Head-first Router موفق

          - Commit: \`${GITHUB_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - نسخه زنده \`Platform 2.4.0 / Router 5.0.0 / Access 2.0.0 / Contracts 1.0.0\` تأیید شد.
          - ثبت‌نام مستقیم با حساب از قبل ساخته‌شده و وضعیت PENDING به‌صورت واقعی تأیید، ACTIVE و از صف انتظار خارج شد؛ همان حساب بعد از تأیید Login موفق داشت.
          - Runtime قدیمی پشتیبانی که `renderModule` را Wrap می‌کرد از HTML حذف شد.
          - پشتیبانی با Runtime مستقیم و بدون Polling، Observer یا Wrapper باز شد.
          - منوی ۱۰‌ماژوله و آیکون‌های خطی پایدار ماندند.
          - جست‌وجوی مراقب، ایجاد قرارداد، کپی سروری «همان مشترک»، ویرایش و Audit واقعی موفق بود.
          - هفت روز قرارداد در تقویم حساب همان مراقب به‌صورت رویداد هفتگی فقط‌خواندنی دیده شد.
          - پس از حذف قرارداد، تمام رویدادهای قراردادی از تقویم مراقب حذف شدند.
          - ماژول قراردادها با کلیک واقعی باز شد و فرم دارای چهار تقویم شمسی Dropdown و هفت روز هفته بود.
          - کلیک واقعی اعتبارات مالی، حقوق و پرداخت، بانک آموزش و پشتیبانی بدون خطای مرورگر موفق بود.
          - کاربران و دسترسی‌ها از Loading خارج شد.
          - حساب‌ها و قراردادهای آزمایشی حذف و پرونده‌های مراقب Smoke مطابق حفاظت داده ناشناس و غیرفعال شدند.
          EOF
          gh issue comment "$VERIFY_ISSUE" --body-file /tmp/success.md

      - name: Report failed head-first smoke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/failure.md <<EOF
          ### تست واقعی قراردادها، ثبت‌نام مستقیم یا Head-first Router ناموفق

          - Commit: \`${GITHUB_SHA}\`
          - Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          چرخه قرارداد، تأیید ثبت‌نام مستقیم، تغذیه تقویم، Runtime مستقیم پشتیبانی، منو، آیکون‌ها، Cleanup یا کلیک‌های واقعی تأیید نشد. Artifact تشخیصی ثبت شده و تا رفع خطا ادعای تحویل ممنوع است.
          EOF
          gh issue comment "$VERIFY_ISSUE" --body-file /tmp/failure.md
